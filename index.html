<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
        
        /* Economy Animations */
        @keyframes seedPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #facc15; }
            100% { transform: scale(1); }
        }
        .seed-animate { animation: seedPop 0.5s ease-out; }
        
        /* Hatching Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .animate-shake { animation: shake 0.5s; animation-iteration-count: infinite; }
        
        .egg-gradient { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0.05) 100%); }

        /* Bird of the Week Found - Celebration Animations */
        @keyframes botwBgPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes botwBirdFly {
            0%   { transform: translateY(0px) rotate(-5deg) scale(1); }
            25%  { transform: translateY(-18px) rotate(5deg) scale(1.1); }
            50%  { transform: translateY(-8px) rotate(-3deg) scale(1.05); }
            75%  { transform: translateY(-22px) rotate(6deg) scale(1.12); }
            100% { transform: translateY(0px) rotate(-5deg) scale(1); }
        }
        @keyframes botwSlideUp {
            from { opacity: 0; transform: translateY(60px) scale(0.85); }
            to   { opacity: 1; transform: translateY(0px) scale(1); }
        }
        @keyframes botwTitlePop {
            0%   { opacity: 0; transform: scale(0.4) rotate(-8deg); }
            60%  { transform: scale(1.15) rotate(3deg); }
            80%  { transform: scale(0.95) rotate(-1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes botwConfetti {
            0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(120px) rotate(720deg); opacity: 0; }
        }
        @keyframes botwStarSpin {
            0%   { transform: rotate(0deg) scale(0); opacity: 0; }
            50%  { transform: rotate(180deg) scale(1.3); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }
        @keyframes botwGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(52, 211, 153, 0.4), 0 0 60px rgba(52, 211, 153, 0.2); }
            50%       { box-shadow: 0 0 40px rgba(52, 211, 153, 0.8), 0 0 100px rgba(52, 211, 153, 0.4); }
        }
        @keyframes botwScoreCount {
            from { transform: scale(1.5); color: #fbbf24; }
            to   { transform: scale(1);   color: #065f46; }
        }
        @keyframes botwShimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes botwRipple {
            0%   { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }
        .botw-modal-enter { animation: botwSlideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .botw-bird-fly    { animation: botwBirdFly 1.8s ease-in-out infinite; }
        .botw-title-pop   { animation: botwTitlePop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both; }
        .botw-star-spin   { animation: botwStarSpin 0.6s ease-out forwards; }
        .botw-glow        { animation: botwGlow 2s ease-in-out infinite; }
        .botw-shimmer-text {
            background: linear-gradient(90deg, #065f46, #34d399, #fbbf24, #34d399, #065f46);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: botwShimmer 2s linear infinite;
        }
        .confetti-piece { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: botwConfetti 1.5s ease-in forwards; }

</head>

        // --- Gemini is secured via Supabase Edge Function (billing attached) ---

        /************************************************************
         * BIRD OF THE WEEK LOGIC
         ************************************************************/
        // Returns ISO string for the Monday that starts the current week
        function getCurrentWeekMonday() {
            const now = new Date();
            const day = now.getDay(); // 0=Sun, 1=Mon...
            const diff = (day === 0) ? -6 : 1 - day; // days back to Monday
            const monday = new Date(now);
            monday.setHours(0, 0, 0, 0);
            monday.setDate(now.getDate() + diff);
            return monday.toISOString().split('T')[0];
        }

        async function getRegionCodeForRegion(region) {
            try {
                const cleanRegion = region.trim();
                console.log('BotW: looking up region code for:', JSON.stringify(cleanRegion));

                // Try exact match first
                const { data, error } = await db
                    .from('d_region_codes')
                    .select('regionCode, Region')
                    .eq('Region', cleanRegion)
                    .maybeSingle();

                if (error) { console.error('Region code lookup error:', error); return null; }

                if (data?.regionCode) {
                    console.log('BotW: found region code:', data.regionCode);
                    return data.regionCode;
                }

                // Fallback: case-insensitive search across all rows
                console.warn('BotW: exact match failed, trying case-insensitive search...');
                const { data: allRows, error: allErr } = await db
                    .from('d_region_codes')
                    .select('regionCode, Region');

                if (allErr || !allRows) return null;

                console.log('BotW: all regions in table:', allRows.map(r => JSON.stringify(r.Region)));

                const match = allRows.find(r => r.Region.trim().toLowerCase() === cleanRegion.toLowerCase());
                if (match) {
                    console.log('BotW: case-insensitive match found:', match.Region, '->', match.regionCode);
                    return match.regionCode;
                }

                console.warn('BotW: no match found. Region from checklist:', JSON.stringify(cleanRegion));
                return null;
            } catch (e) { console.error('Region code error:', e); return null; }
        }

        // Returns { species, total } or { species: null, total: 0 } on no results, null on error
        async function fetchBirdOfWeek(regionCode, excludeList = []) {
            try {
                const resp = await fetch(
                    `https://api.ebird.org/v2/data/obs/${regionCode}/recent/notable?detail=simple`,
                    { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                );
                if (!resp.ok) { console.error('eBird edge function error:', resp.status); return null; }
                const observations = await resp.json();
                if (!observations || observations.length === 0) return { species: null, total: 0 };

                const allSpecies = [...new Set(observations.map(o => o.comName))];
                const total = allSpecies.length;

                // Try to pick one not in the exclusion list
                const candidates = allSpecies.length > 1
                    ? allSpecies.filter(s => !excludeList.includes(s))
                    : allSpecies;

                // If we've exhausted all options, pick from the full list
                const pool = candidates.length > 0 ? candidates : allSpecies;
                const species = pool[Math.floor(Math.random() * pool.length)];
                return { species, total };
            } catch (e) { console.error('eBird fetch error:', e); return null; }
        }

        async function initBirdOfWeek() {
            if (!state.lastRegion) return;
            if (state.birdOfWeekLoading) return; // already in progress, don't double-call
            const weekStart = getCurrentWeekMonday();

            // If we already have a confirmed bird for this week, skip re-fetching
            if (state.birdOfWeek && state.birdOfWeek.weekStart === weekStart && state.birdOfWeek.species) return;

            state.birdOfWeekLoading = true;
            state.birdOfWeekError = null;
            render();

            // Step 1: look up the eBird region code
            const regionCode = await getRegionCodeForRegion(state.lastRegion);
            if (!regionCode) {
                console.warn('BotW: no region code for', state.lastRegion);
                state.birdOfWeekLoading = false;
                state.birdOfWeekError = `No eBird region code found for "${state.lastRegion}"`;
                render();
                return;
            }

            // Step 2: fetch notable observations via Edge Function
            const result = await fetchBirdOfWeek(regionCode);
            if (!result) {
                state.birdOfWeekError = `Could not reach the eBird service. Please try again later.`;
            } else if (result.total === 0) {
                state.birdOfWeekError = `No notable birds have been reported in your region recently. Check back next week!`;
            } else {
                const prevFound = (state.birdOfWeek?.weekStart === weekStart) ? (state.birdOfWeek.found || false) : false;
                state.birdOfWeek = { species: result.species, weekStart, regionCode, region: state.lastRegion, found: prevFound, seenSpecies: [] };
                state.birdOfWeekError = null;
                await saveData();
            }

            state.birdOfWeekLoading = false;
            render();
        }

        // Call after a checklist is processed to check if Bird of the Week was found
        function checkBirdOfWeekFound(observations) {
            if (!state.birdOfWeek || state.birdOfWeek.found) return false;
            const weekStart = getCurrentWeekMonday();
            if (state.birdOfWeek.weekStart !== weekStart) return false;
            const target = state.birdOfWeek.species.toLowerCase();
            return observations.some(o => o.species_code.toLowerCase() === target || (o.common_name && o.common_name.toLowerCase() === target));
        }

        // --- RARITY DEFINITIONS (Synced across Checklist and Hatching) ---
        const RARITY_TIERS = [
            { id: 'MEGA RARE', min: 0, max: 0.02, chance: 0.02, color: 'purple' },
            { id: 'RARE', min: 0.02, max: 0.1, chance: 0.05, color: 'red' },
            { id: 'SCARCE', min: 0.1, max: 0.2, chance: 0.10, color: 'orange' },
            { id: 'UNCOMMON', min: 0.2, max: 0.3, chance: 0.20, color: 'yellow' },
            { id: 'COMMON', min: 0.3, max: 1.1, chance: 0.63, color: 'gray' }
        ];

        let state = {
            currentUser: null,
            users: [],
            checklists: [],
            userHistory: [], 
            birdseed: 0,
            eggs: [], 
            birds: [], 
            frequencyData: {},
            regionSpeciesMap: {}, 
            regions: [],
            lastRegion: null, 
            currentResult: null,
            view: 'home',
            showRegionPrompt: false,
            expandedChecklistId: null, 
            showHowItWorks: false,
            expandedSpeciesId: null,   
            showUserSelect: false,
            showManageUsers: false,
            hatchingEgg: null,
            isHatching: false,
            hatchResult: null,
            loading: true,
            birdOfWeek: null,        // { species, weekStart, regionCode, found }
            birdOfWeekLoading: false,
            birdOfWeekError: null,
            showBirdOfWeekFound: false,
            // eBird checklist picker
            eBirdUsername: null,
            showChecklistPicker: false,
            showUsernamePrompt: false,
            eBirdChecklists: [],
            checklistPickerLoading: false,
            checklistPickerError: null,
            fetchingChecklist: null   // subId of checklist currently being fetched
        };

        const EGG_TYPES = [
            { id: 'common', name: 'Common Egg', cost: 1, color: 'bg-gray-200', emoji: '🥚', luck: 1 },
            { id: 'speckled', name: 'Speckled Egg', cost: 5, color: 'bg-blue-100', emoji: '🪺', luck: 2 },
            { id: 'golden', name: 'Golden Egg', cost: 20, color: 'bg-yellow-200', emoji: '✨', luck: 3 }
        ];

        /************************************************************
         * AI FACT GENERATION (via Supabase Edge Function)
         ************************************************************/
        async function getBirdFact(species, rarity) {
            try {
                const response = await fetch(
                    `${SB_URL}/functions/v1/bird-fact`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ species, rarity })
                    }
                );

                const data = await response.json();
                const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                return text ? text.trim() : "A mysterious avian marvel.";

            } catch (error) {
                console.error("Gemini Error:", error);
                return "Known for its unique role in the local ecosystem.";
            }
        }

        /************************************************************
         * USER & CLOUD LOGIC
         ************************************************************/
        async function loadData() {
            state.loading = true;
            render();
            try {
                const { data: profiles } = await db.from('profiles').select('username');
                if (profiles) state.users = profiles.map(p => p.username);

                await fetchFrequencyData();

                const savedUser = localStorage.getItem('current_user');
                if (savedUser && state.users.includes(savedUser)) {
                    await selectUser(savedUser);
                } else {
                    state.showUserSelect = true;
                }
            } catch (error) { console.error('Initial load error:', error); }
            state.loading = false;
            render();
        }

        async function selectUser(username) {
            state.loading = true;
            render();
            state.currentUser = username;
            localStorage.setItem('current_user', username);
            try {
                const { data } = await db.from('checklist_data').select('data, history').eq('username', username).maybeSingle();
                const rawData = data?.data;
                state.userHistory = data?.history || [];

                if (rawData && typeof rawData === 'object' && !Array.isArray(rawData)) {
                    state.checklists = rawData.checklists || [];
                    state.birdseed = rawData.birdseed || 0;
                    state.eggs = rawData.eggs || [];
                    state.birds = rawData.birds || [];
                    // Restore birdOfWeek but only if it's from this week
                    const savedBotW = rawData.birdOfWeek;
                    if (savedBotW && savedBotW.weekStart === getCurrentWeekMonday()) {
                        state.birdOfWeek = savedBotW;
                    } else {
                        state.birdOfWeek = null;
                    }
                    // Restore eBird username
                    state.eBirdUsername = rawData.eBirdUsername || null;
                } else {
                    state.checklists = [];
                    state.birdseed = 0;
                    state.eggs = [];
                    state.birds = [];
                }

                if (state.checklists.length > 0) {
                    state.currentResult = state.checklists[0];
                    state.lastRegion = state.checklists[0].region;
                }
            } catch (error) { console.error("Load error:", error); }
            state.showUserSelect = false;
            state.showManageUsers = false;
            state.loading = false;
            render();
            // Init Bird of the Week once user data (and lastRegion) is loaded
            initBirdOfWeek();
        }

        async function createUser(username) {
            if (!username || username.trim() === '') return alert('Enter a username');
            const { error } = await db.from('profiles').insert([{ username: username.trim() }]);
            if (error) return alert('User exists or DB error');
            state.users.push(username.trim());
            await selectUser(username.trim());
        }

        async function deleteUser(username) {
            if (!confirm(`Delete ${username}? Data cannot be recovered.`)) return;
            await db.from('checklist_data').delete().eq('username', username);
            await db.from('profiles').delete().eq('username', username);
            state.users = state.users.filter(u => u !== username);
            if (state.currentUser === username) {
                state.currentUser = null;
                localStorage.removeItem('current_user');
                state.showUserSelect = true;
            }
            render();
        }

        async function saveData() {
            if (!state.currentUser) return;
            const packedData = {
                checklists: state.checklists,
                birdseed: state.birdseed,
                eggs: state.eggs,
                birds: state.birds,
                birdOfWeek: state.birdOfWeek,
                eBirdUsername: state.eBirdUsername
            };
            await db.from('checklist_data').upsert({
                username: state.currentUser,
                data: packedData, 
                history: state.userHistory,
                updated_at: new Date().toISOString()
            }, { onConflict: 'username' });
        }

        /************************************************************
         * HATCHING LOGIC
         ************************************************************/
        function buyEgg(eggType) {
            if (state.birdseed >= eggType.cost) {
                state.birdseed -= eggType.cost;
                state.eggs.push({ ...eggType, uuid: Date.now() + Math.random().toString() });
                saveData();
                render();
            } else alert("Not enough birdseed!");
        }

        async function handleDrop(e) {
            e.preventDefault();
            if (state.isHatching) return;
            const eggUuid = e.dataTransfer.getData("text/plain");
            const eggIndex = state.eggs.findIndex(egg => egg.uuid === eggUuid);
            if (eggIndex > -1) {
                const egg = state.eggs[eggIndex];
                state.eggs.splice(eggIndex, 1);
                state.hatchingEgg = egg;
                state.isHatching = true;
                render();
                
                // Finalize hatch after animation
                setTimeout(() => { finalizeHatch(egg); }, 2000);
            }
        }

        async function finalizeHatch(egg) {
            const hatchedBird = pickBird(egg.luck);
            // Fetch AI fact
            const funFact = await getBirdFact(hatchedBird.species, hatchedBird.rarity);
            
            state.birds.unshift({ 
                ...hatchedBird, 
                hatchedAt: new Date().toLocaleDateString(),
                fact: funFact 
            });
            
            state.hatchingEgg = null;
            state.isHatching = false;
            state.hatchResult = state.birds[0];
            saveData();
            render();
        }

        function pickBird(luckMultiplier) {
            let targetRegion = state.lastRegion || Object.keys(state.regionSpeciesMap)[0];
            const speciesPool = state.regionSpeciesMap[targetRegion];

            const rollTier = () => {
                const rand = Math.random();
                let cumulative = 0;
                for (const tier of RARITY_TIERS) {
                    cumulative += tier.chance;
                    if (rand <= cumulative) return tier;
                }
                return RARITY_TIERS[4];
            };

            let bestTier = rollTier();
            const tierOrder = RARITY_TIERS.map(t => t.id);
            for (let i = 1; i < luckMultiplier; i++) {
                const newTier = rollTier();
                if (tierOrder.indexOf(newTier.id) < tierOrder.indexOf(bestTier.id)) bestTier = newTier;
            }

            let birdsInTier = speciesPool.filter(b => b.peak_frequency >= bestTier.min && b.peak_frequency < bestTier.max);
            if (birdsInTier.length === 0) {
                bestTier = RARITY_TIERS[4]; // Fallback to common
                birdsInTier = speciesPool.filter(b => b.peak_frequency >= bestTier.min);
            }

            const totalWeight = birdsInTier.reduce((sum, b) => sum + b.peak_frequency, 0);
            let birdRand = Math.random() * totalWeight;
            let winner = birdsInTier[0];
            for (const bird of birdsInTier) {
                birdRand -= bird.peak_frequency;
                if (birdRand <= 0) { winner = bird; break; }
            }

            return { species: winner.species, rarity: bestTier.id, rarity_color: bestTier.color, region: targetRegion };
        }

        /************************************************************
         * DATA PROCESSING
         ************************************************************/
        async function fetchFrequencyData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Bengician/bird-brain/main/frequency_data.json');
                const data = await response.json();
                const regionMap = {};
                Object.keys(data).forEach(key => {
                    const parts = key.split('_');
                    if (parts.length >= 3) {
                        const region = parts.slice(2).join('_');
                        const species = parts[0];
                        const info = data[key];
                        if (!regionMap[region]) regionMap[region] = [];
                        let existing = regionMap[region].find(b => b.species === species);
                        let currentVal = info.peak_frequency || info.frequency;
                        if (!existing) regionMap[region].push({ species, peak_frequency: currentVal });
                        else if (currentVal > existing.peak_frequency) existing.peak_frequency = currentVal;
                    }
                });
                state.frequencyData = data;
                state.regionSpeciesMap = regionMap; 
                state.regions = Object.keys(regionMap).sort();
            } catch (error) { console.error('Freq Error:', error); }
        }

        function weekOfYear(dateStr) {
            const date = new Date(dateStr);
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((Math.floor((date - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
        }

        function scoreObservation(species, date, count, history, freqData, region) {
            const week = weekOfYear(date);
            const info = freqData[`${species}_${week}_${region}`];
            if (!info) return { species_code: species, score: 0, error: true };
            
            const base = 10 * Math.log10(1 / Math.max(info.frequency, 0.001));
            const season = info.frequency < 0.25 * info.peak_frequency ? 1.5 : 1.0;
            const prevCount = history.filter(h => h.species_code === species).length;
            const novelty = prevCount === 0 ? 4.0 : (prevCount === 1 ? 2.0 : 1.0);
            const final = Math.round(base * season * novelty * count * 10);
            
            const tier = RARITY_TIERS.find(t => info.peak_frequency >= t.min && info.peak_frequency < t.max) || RARITY_TIERS[4];
            
            return {
                species_code: species, score: final, base_score: Math.round(base * 10),
                seasonal_bonus: season, novelty_multiplier: novelty, count_multiplier: count,
                rarity: tier.id, rarity_color: tier.color, frequency: info.frequency, 
                is_first: prevCount === 0, is_second: prevCount === 1
            };
        }




        /************************************************************
         * eBIRD CHECKLIST PICKER
         ************************************************************/
        function handleChecklistSelect(btn) {

            const loc = btn.dataset.loc;

                state.showUsernamePrompt = true;
                render();
                return;
            }
            state.showChecklistPicker = true;
            state.checklistPickerLoading = true;
            state.checklistPickerError = null;

        }

        async function saveeBirdUsername(username) {
            username = username.trim();
            if (!username) return;
            state.eBirdUsername = username;
            state.showUsernamePrompt = false;
            await saveData();
            // Now open the picker
            await openChecklistPicker();
        }

        async function fetchUserChecklists() {
            try {
                // eBird API has no public "by username" endpoint — we fetch the regional
                // feed and filter client-side by the user's display name.
                const regionCode = state.birdOfWeek?.regionCode || (state.lastRegion ? await getRegionCodeForRegion(state.lastRegion) : null);
                if (!regionCode) {
                    state.checklistPickerError = 'Could not determine your region. Please upload a checklist first to set your region.';
                    state.checklistPickerLoading = false;
                    render();
                    return;
                }

                // Fetch up to 200 recent regional checklists, then filter by username
                const resp = await fetch(
                    `https://api.ebird.org/v2/product/lists/${regionCode}?maxResults=200`,
                    { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                );
                if (!resp.ok) {
                    state.checklistPickerError = `eBird returned an error (${resp.status}). Please try again.`;
                    state.checklistPickerLoading = false;
                    render();
                    return;
                }
                const data = await resp.json();
                if (!data || data.length === 0) {
                    state.checklistPickerError = 'No recent checklists found in your region.';
                    state.checklistPickerLoading = false;
                    render();
                    return;
                }

                // Filter by username (case-insensitive match against userDisplayName)
                const username = state.eBirdUsername.toLowerCase();
                const userChecklists = data.filter(cl =>
                    (cl.userDisplayName || '').toLowerCase() === username ||
                    (cl.userDisplayName || '').toLowerCase().includes(username)
                );

                if (userChecklists.length === 0) {
                    state.checklistPickerError = `No recent checklists found for "${state.eBirdUsername}" in your region (${regionCode}). Note: your eBird display name may differ from your username — try entering your display name as it appears on eBird.`;
                    state.checklistPickerLoading = false;
                    render();
                    return;
                }

                state.eBirdChecklists = userChecklists.slice(0, 20);
                state.checklistPickerLoading = false;
                render();
            } catch (e) {
                state.checklistPickerError = 'Could not reach eBird. Please check your connection.';
                state.checklistPickerLoading = false;
                render();
            }
        }

        async function selecteBirdChecklist(subId, locName, isoObsDate, subnational2Name) {
            state.fetchingChecklist = subId;
            render();
            try {
                // Step 1: fetch the full checklist
                const resp = await fetch(
                    `https://api.ebird.org/v2/product/checklist/view/${subId}`,
                    { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                );
                if (!resp.ok) throw new Error(`eBird returned ${resp.status}`);
                const data = await resp.json();
                const date = isoObsDate ? isoObsDate.split(' ')[0] : new Date().toISOString().split('T')[0];

                // Step 2: collect all species codes from this checklist
                const obsList = data.obs || [];
                const speciesCodes = [...new Set(obsList.map(o => o.speciesCode).filter(Boolean))];

                // Step 3: translate species codes -> common names via eBird taxonomy endpoint
                // Our frequency data is keyed by common name, so we must translate first
                let codeToName = {};
                if (speciesCodes.length > 0) {
                    const taxResp = await fetch(
                        `https://api.ebird.org/v2/ref/taxonomy/ebird?fmt=json&species=${speciesCodes.join(',')}`,
                        { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                    );
                    if (taxResp.ok) {
                        const taxData = await taxResp.json();
                        taxData.forEach(t => { codeToName[t.speciesCode] = t.comName; });
                    }
                }

                // Step 4: build observations using common names for scoring
                const observations = obsList.map(o => ({
                    species: codeToName[o.speciesCode] || o.speciesCode, // fallback to code if lookup fails
                    speciesCode: o.speciesCode,
                    date,
                    count: (o.howManyStr && o.howManyStr.toUpperCase() !== 'X') ? parseInt(o.howManyStr, 10) || 1 : 1
                }));

                state.showChecklistPicker = false;
                state.fetchingChecklist = null;
                await processeBirdChecklist(observations, date, locName, subnational2Name);
            } catch (e) {
                state.fetchingChecklist = null;
                state.checklistPickerError = `Could not load checklist: ${e.message}`;
                render();
            }
        }

        async function processeBirdChecklist(observations, date, locName, subnational2Name) {
            // locName is the specific eBird location (e.g. "Kalamalka Lake (Vernon)")
            // We need to match it to one of our scoring regions (e.g. "North Okanagan")
            // Try exact match first, then partial, then fall back to lastRegion, then prompt
            console.log('processeBirdChecklist: locName =', JSON.stringify(locName));
            console.log('processeBirdChecklist: available regions =', state.regions);
            console.log('processeBirdChecklist: lastRegion =', state.lastRegion);

            // subnational2Name (e.g. "North Okanagan") is the most reliable match
            let matchedRegion = subnational2Name
                ? state.regions.find(r => r.toLowerCase() === subnational2Name.toLowerCase())
                : null;
            // Fall back to matching against the specific location name
            if (!matchedRegion) {
                matchedRegion = state.regions.find(r => r.toLowerCase() === locName.toLowerCase());
            }
            if (!matchedRegion) {
                matchedRegion = state.regions.find(r =>
                    locName.toLowerCase().includes(r.toLowerCase()) ||
                    r.toLowerCase().includes(locName.toLowerCase().split(',')[0].trim())
                );
            }

            console.log('processeBirdChecklist: matchedRegion =', matchedRegion);

            if (!matchedRegion) {
                if (state.lastRegion) {
                    console.log('processeBirdChecklist: falling back to lastRegion =', state.lastRegion);
                    matchedRegion = state.lastRegion;
                } else {
                    console.log('processeBirdChecklist: no match, showing region prompt');
                    state.pendingeBirdObservations = { observations, date, locName };
                    state.showRegionPrompt = true;
                    render();
                    return;
                }
            }

            await scoreFetchedChecklist(observations, date, matchedRegion);
        }

        async function scoreFetchedChecklist(observations, date, region) {
            const currentTotalScore = state.checklists.reduce((sum, c) => sum + c.total_score, 0);
            const previousSeeds = Math.floor(currentTotalScore / 10000);

            const results = [];
            const tempHistory = [...state.userHistory];
            let total = 0;

            console.log('scoreFetchedChecklist: region =', region, '| date =', date, '| obs count =', observations.length);
            for (const obs of observations) {
                const { species, count } = obs;
                if (!species) continue;
                const week = weekOfYear(date);
                const freqKey = `${species.trim()}_${week}_${region}`;
                const freqHit = state.frequencyData[freqKey];
                if (!freqHit) console.warn('No freq data for key:', JSON.stringify(freqKey));
                const res = scoreObservation(
                    species.trim(),
                    date,
                    isNaN(count) ? 1 : count,
                    tempHistory,
                    state.frequencyData,
                    region
                );
                results.push(res);
                total += res.score;
                if (!res.error) {
                    for (let i = 0; i < count; i++) {
                        tempHistory.push({ date, species_code: species.trim() });
                    }
                }
            }
            console.log('scoreFetchedChecklist: total =', total, '| results sample =', results.slice(0,3));

            const seedsEarnedNow = Math.max(0, Math.floor((currentTotalScore + total) / 10000) - previousSeeds);
            state.birdseed += seedsEarnedNow;

            // Check Bird of the Week
            const botWFound = checkBirdOfWeekFound(results);
            let appliedBotW = false;
            if (botWFound) {
                state.birdOfWeek.found = true;
                appliedBotW = true;
                state.showBirdOfWeekFound = true;
            }

            const botWActive = state.birdOfWeek && state.birdOfWeek.found && state.birdOfWeek.weekStart === getCurrentWeekMonday();
            if (botWActive) {
                total = 0;
                results.forEach(o => {
                    o.score = o.score * 2;
                    o.botw_doubled = true;
                    total += o.score;
                });
            }

            state.checklists = [{
                id: Date.now(),
                date,
                region,
                total_score: total,
                species_count: results.length,
                observations: results,
                seed_earned: seedsEarnedNow,
                botw_applied: botWActive,
                botw_unlocked: appliedBotW
            }, ...state.checklists];

            state.lastRegion = region;
            state.userHistory = tempHistory;
            state.currentResult = state.checklists[0];
            state.pendingeBirdObservations = null;
            await saveData();
            render();
            initBirdOfWeek();
        }

        /************************************************************
         * BIRD OF THE WEEK - RE-ROLL & CELEBRATION
         ************************************************************/
        async function rerollBirdOfWeek() {
            if (state.birdOfWeekLoading || !state.birdOfWeek) return;
            const regionCode = state.birdOfWeek.regionCode;

            // Track all species seen so far this week to avoid repeats
            const seenSpecies = [...(state.birdOfWeek.seenSpecies || []), state.birdOfWeek.species];

            state.birdOfWeekLoading = true;
            state.birdOfWeekError = null;
            render();

            const result = await fetchBirdOfWeek(regionCode, seenSpecies);

            if (!result) {
                state.birdOfWeekError = 'Could not reach the eBird service. Please try again.';
            } else if (result.total === 0) {
                state.birdOfWeekError = 'No notable birds have been reported in your region recently.';
            } else {
                state.birdOfWeek = {
                    species: result.species,
                    weekStart: getCurrentWeekMonday(),
                    regionCode,
                    region: state.birdOfWeek.region,
                    found: false,
                    seenSpecies  // carry forward the history so future re-rolls keep avoiding these
                };
                await saveData();
            }

            state.birdOfWeekLoading = false;
            render();
        }

        function playBirdFoundSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

                const playNote = (freq, start, duration, type = 'sine', gain = 0.3) => {
                    const osc = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                    gainNode.gain.setValueAtTime(0, ctx.currentTime + start);
                    gainNode.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + duration);
                };

                // Triumphant fanfare: ascending arpeggio then chord
                playNote(523.25, 0.0,  0.18, 'triangle', 0.35); // C5
                playNote(659.25, 0.15, 0.18, 'triangle', 0.35); // E5
                playNote(783.99, 0.30, 0.18, 'triangle', 0.35); // G5
                playNote(1046.5, 0.45, 0.40, 'triangle', 0.40); // C6
                // Harmony layer
                playNote(659.25, 0.45, 0.40, 'sine', 0.20);     // E5
                playNote(783.99, 0.45, 0.40, 'sine', 0.18);     // G5
                // Sparkle flourish
                playNote(1318.5, 0.80, 0.12, 'sine', 0.15);     // E6
                playNote(1568.0, 0.90, 0.12, 'sine', 0.15);     // G6
                playNote(2093.0, 1.00, 0.25, 'sine', 0.12);     // C7
                // Final big chord
                playNote(523.25, 1.20, 0.6, 'triangle', 0.25);
                playNote(659.25, 1.20, 0.6, 'triangle', 0.22);
                playNote(783.99, 1.20, 0.6, 'triangle', 0.20);
                playNote(1046.5, 1.20, 0.6, 'triangle', 0.30);
            } catch(e) { console.log('Audio not available', e); }
        }

                    <div class="bg-orange-400/20 rounded-b-3xl -mt-3 pt-5 pb-3 px-3">${rerollBtn}</div>
                </div>`;
            }
        }

        function renderHome(stats) {
            return `
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-blue-600">${stats.obs}</div><div class="text-[10px] uppercase font-bold text-gray-400">Sightings</div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-green-600">${stats.spec}</div><div class="text-[10px] uppercase font-bold text-gray-400">Species</div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-yellow-500">${stats.score.toLocaleString()}</div><div class="text-[10px] uppercase font-bold text-gray-400">Total Score</div></div>
                </div>
                <div class="bg-yellow-50 border-2 border-yellow-200 p-4 rounded-3xl mb-6 flex items-center justify-between">
                    <div><div class="text-[10px] font-black text-yellow-600 uppercase tracking-widest">Banked Seed</div><div class="text-2xl font-black text-yellow-700">🟡 ${state.birdseed}</div></div>
                    <div class="text-xs text-yellow-600 font-bold max-w-[120px] text-right">Earn 1 seed for every 10k cumulative points!</div>
                </div>
                <button onclick="openChecklistPicker()" class="block w-full mb-4 group">
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-10 rounded-3xl text-center font-black shadow-xl group-active:scale-95 transition-all">
                        <div class="text-5xl mb-3">🔍</div>
                        <div class="text-2xl">Fetch My Checklists</div>
                        ${state.eBirdUsername ? `<div class="text-sm opacity-70 mt-2 font-bold">@${state.eBirdUsername}</div>` : `<div class="text-sm opacity-70 mt-2 font-bold">Connect your eBird account</div>`}
                    </div>
                </button>
                ${renderBirdOfWeekBanner()}
                <button onclick="state.showHowItWorks=true;render()" class="w-full text-gray-400 text-xs font-bold uppercase tracking-widest mb-8 hover:text-blue-500 transition-colors">How is Score Calculated?</button>
                ${state.currentResult ? renderChecklistCard(state.currentResult, true) : `<div class="text-center py-20 text-gray-300 font-bold border-4 border-dashed rounded-3xl">No data uploaded yet.</div>`}
            `;
        }

        function renderNest() {
            return `
                <div class="mb-6"><h2 class="font-black text-3xl text-gray-900 mb-2">The Nest</h2><p class="text-gray-400 font-bold text-sm uppercase tracking-tighter">Exchange Birdseed for Rare Eggs</p></div>
                <div class="grid grid-cols-1 gap-4 mb-10">
                    ${EGG_TYPES.map(egg => `
                        <div class="bg-white p-5 rounded-3xl border-2 shadow-sm flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="text-4xl ${egg.color} w-16 h-16 flex items-center justify-center rounded-2xl shadow-inner">${egg.emoji}</div>
                                <div><div class="font-black text-gray-800 text-lg">${egg.name}</div><div class="text-xs font-bold text-yellow-600">🟡 ${egg.cost} Birdseed</div></div>
                            </div>
                            <button onclick="buyEgg(${JSON.stringify(egg).replace(/"/g, '&quot;')})" 
                                class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all ${state.birdseed < egg.cost ? 'opacity-30 grayscale pointer-events-none' : ''}">Buy</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCollection() {
            return `
                <div class="mb-6"><h2 class="font-black text-3xl text-gray-900">Your Collection</h2></div>
                <div class="mb-8 p-6 bg-gray-100 rounded-[40px] border-4 border-dashed border-gray-300 text-center relative transition-all ${state.isHatching ? 'animate-shake bg-yellow-50 border-yellow-300' : ''}"
                     ondragover="event.preventDefault()" ondrop="handleDrop(event)">
                    ${state.isHatching ? `<div class="text-6xl mb-4 animate-bounce">${state.hatchingEgg.emoji}</div><div class="font-black text-yellow-600 uppercase tracking-widest animate-pulse">Hatching...</div>` : `<div class="text-4xl text-gray-300 mb-2">📥</div><div class="text-gray-400 font-bold text-sm uppercase tracking-widest">Drag Egg Here to Hatch</div>`}
                </div>
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Unhatched Eggs (${state.eggs.length})</h3>
                <div class="flex gap-4 overflow-x-auto pb-4 mb-8 snap-x">
                    ${state.eggs.map(egg => `<div draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '${egg.uuid}')" class="flex-shrink-0 snap-start bg-white p-4 rounded-3xl border w-32 text-center shadow-sm relative cursor-move active:scale-95 transition-transform"><div class="text-4xl mb-2 select-none">${egg.emoji}</div><div class="font-black text-gray-800 text-xs truncate">${egg.name}</div></div>`).join('')}
                </div>
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Trophy Room (${state.birds.length})</h3>
                <div class="grid grid-cols-2 gap-4">
                    ${state.birds.map(bird => `
                        <div class="bg-white p-4 rounded-3xl border border-${bird.rarity_color}-100 shadow-sm relative overflow-hidden flex flex-col h-full">
                            <div class="text-xs font-black text-${bird.rarity_color}-600 uppercase mb-1 tracking-tighter">${bird.rarity}</div>
                            <div class="font-black text-gray-800 leading-tight mb-2">${bird.species}</div>
                            <p class="text-[10px] text-gray-500 italic flex-grow mb-2 leading-tight">"${bird.fact || 'A mysterious find...'}"</p>
                            <div class="text-[10px] text-gray-400 mt-auto">From ${bird.region}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderHatchModal() {
            const bird = state.hatchResult;
            return `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50 animate-fadeIn">
                    <div class="bg-white rounded-[40px] p-10 max-w-sm text-center shadow-2xl relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-b from-${bird.rarity_color}-50 to-white -z-10"></div>
                        <div class="text-sm font-black text-gray-400 uppercase tracking-widest mb-4">You Hatched A...</div>
                        <div class="text-6xl mb-6 animate-bounce">🐦</div>
                        <h2 class="font-black text-3xl text-gray-900 mb-2">${bird.species}</h2>
                        <div class="inline-block bg-${bird.rarity_color}-100 text-${bird.rarity_color}-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest mb-4 border border-${bird.rarity_color}-200">${bird.rarity}</div>
                        
                        <div class="bg-white/60 p-4 rounded-2xl mb-6 border border-gray-100 italic text-gray-700 text-sm leading-relaxed">
                            "${bird.fact || 'Calculating amazing facts...'}"
                        </div>
                        
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-6">Region: ${bird.region}</div>
                        <button onclick="state.hatchResult=null; render()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200">Keep!</button>
                    </div>
                </div>`;
        }

        function renderChecklistCard(c, isLatest) {
            const botwBadge = c.botw_unlocked 
                ? `<div class="absolute -top-3 -left-3 bg-emerald-500 text-white px-3 py-1.5 rounded-2xl font-black text-xs shadow-xl border-2 border-white">🐦 Bird of Week Found!</div>`
                : (c.botw_applied ? `<div class="absolute -top-3 -left-3 bg-teal-500 text-white px-3 py-1.5 rounded-2xl font-black text-xs shadow-xl border-2 border-white">✨ 2× Week Bonus</div>` : '');
            return `<div class="bg-white p-6 rounded-3xl shadow-xl border relative">${c.seed_earned > 0 ? `<div class="absolute -top-3 -right-3 bg-yellow-400 text-yellow-900 px-4 py-2 rounded-2xl font-black text-sm shadow-xl seed-animate border-2 border-white">+${c.seed_earned} 🟡</div>` : ''}${botwBadge}
                <div class="flex justify-between items-center mb-1"><h2 class="font-black text-xl text-gray-900">${isLatest ? 'Last Checklist' : ''}</h2><div class="text-3xl font-black text-blue-600">${c.total_score.toLocaleString()}</div></div>
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-6">📅 ${c.date} • 📍 ${c.region}</div>
                <div class="space-y-2">${c.observations.map((o, i) => renderObservationRow(o, i, 'home')).join('')}</div></div>`;
        }

        function renderObservationRow(o, i, viewType) {
            const uniqueId = `${viewType}_${o.species_code}_${i}`, isExpanded = state.expandedSpeciesId === uniqueId;
            return `<div class="border-2 border-${o.rarity_color}-100 bg-${o.rarity_color}-50 rounded-2xl overflow-hidden mb-2 transition-all">
                <button onclick="state.expandedSpeciesId = (state.expandedSpeciesId === '${uniqueId}' ? null : '${uniqueId}'); render()" class="w-full p-4 flex justify-between items-center">
                    <div class="text-left"><div class="font-black text-gray-800 text-lg flex items-center gap-2">${o.species_code} <span class="text-[10px] bg-${o.rarity_color}-600 text-white px-2 py-0.5 rounded-full uppercase font-bold tracking-tighter">${o.rarity}</span></div>
                    <div class="flex items-center gap-2 mt-0.5">${o.is_first ? '<span class="text-[10px] font-black text-green-600 uppercase tracking-tighter">Life Bird! (4x Bonus)</span>' : (o.is_second ? '<span class="text-[10px] font-black text-blue-500 uppercase tracking-tighter">2nd Sighting (2x Bonus)</span>' : '')}
                    ${o.count_multiplier > 1 ? `<span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded-md font-black border border-green-200 uppercase tracking-tighter">x${o.count_multiplier}</span>` : ''}</div></div>
                    <div class="font-black text-xl text-blue-800">${o.score.toLocaleString()}</div>
                </button>
                ${isExpanded ? `<div class="p-4 border-t bg-white text-[11px] space-y-2 text-gray-600 animate-fadeIn">
                    <div class="flex justify-between"><span>Base Score (F: ${(o.frequency*100).toFixed(2)}%)</span><span class="font-bold text-blue-600">${o.base_score}</span></div>
                    <div class="flex justify-between"><span>Seasonal Multiplier</span><span class="font-bold text-orange-500">×${o.seasonal_bonus}</span></div>
                    <div class="flex justify-between"><span>Novelty Multiplier</span><span class="font-bold text-purple-600">×${o.novelty_multiplier}</span></div>
                    <div class="flex justify-between"><span>Observation Multiplier</span><span class="font-bold text-green-600">×${o.count_multiplier}</span></div>
                    ${o.botw_doubled ? `<div class="flex justify-between text-emerald-700"><span>🐦 Bird of the Week Bonus</span><span class="font-bold">×2</span></div>` : ''}
                    <div class="flex justify-between font-black border-t pt-2 text-gray-900 text-sm"><span>Final Points</span><span>${o.score.toLocaleString()}</span></div>
                </div>` : ''}</div>`;
        }

        function renderHistory() {
            return `<div class="flex justify-between items-end mb-6"><h2 class="font-black text-3xl text-gray-900">History</h2><button onclick="if(confirm('Wipe History?')) { state.checklists=[]; state.userHistory=[]; state.birdseed=0; state.eggs=[]; state.birds=[]; saveData(); render(); }" class="text-[10px] font-black text-red-400 uppercase tracking-widest">Clear All</button></div>
                <div class="space-y-4">${state.checklists.map(c => `<div class="bg-white rounded-3xl shadow-sm border overflow-hidden"><button onclick="state.expandedChecklistId = (state.expandedChecklistId === ${c.id} ? null : ${c.id}); render();" class="w-full p-5 flex justify-between items-center hover:bg-gray-50 transition-colors"><div class="text-left"><div class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">${c.date}</div><div class="font-black text-gray-800">${c.region}</div></div><div class="flex items-center gap-3">${c.seed_earned ? `<span class="text-xs font-black text-yellow-500">🟡 +${c.seed_earned}</span>` : ''}<div class="text-2xl font-black text-blue-600">${c.total_score.toLocaleString()}</div><span class="text-gray-300 font-bold">${state.expandedChecklistId === c.id ? '▲' : '▼'}</span></div></button>${state.expandedChecklistId === c.id ? `<div class="bg-gray-50 border-t p-4 space-y-3 animate-fadeIn">${c.observations.map((o, idx) => renderObservationRow(o, idx, 'history_' + c.id)).join('')}</div>` : ''}</div>`).join('')}</div>`;
        }

        function renderRegionPrompt() {
            const onSelect = state.pendingeBirdObservations
                ? `(r) => { state.showRegionPrompt=false; scoreFetchedChecklist(state.pendingeBirdObservations.observations, state.pendingeBirdObservations.date, r); }`
                : `(r) => processChecklist(r)`;
            return `<div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50"><div class="bg-white rounded-3xl p-8 w-full max-w-sm max-h-[70vh] overflow-y-auto shadow-2xl"><h2 class="font-black text-2xl mb-2 text-gray-900">Pick Your Region</h2><p class="text-gray-400 text-sm mb-6">The checklist location didn't match any known region. Choose the closest one.</p><div class="space-y-1">${state.regions.map(r => `<button onclick="state.showRegionPrompt=false; ${state.pendingeBirdObservations ? `scoreFetchedChecklist(state.pendingeBirdObservations.observations, state.pendingeBirdObservations.date, '${r}')` : `processChecklist('${r}')`}" class="w-full text-left p-4 border-b hover:bg-blue-50 font-bold text-gray-800 transition-colors flex justify-between"><span>${r}</span><span class="text-blue-500">→</span></button>`).join('')}</div><button onclick="state.showRegionPrompt=false; state.pendingeBirdObservations=null; render();" class="w-full mt-6 text-gray-400 font-black uppercase text-xs tracking-widest">Cancel</button></div></div>`;
        }

        function renderHowItWorks() {
            return `<div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 z-50"><div class="bg-white rounded-[40px] p-8 max-w-md shadow-2xl relative"><h2 class="font-black text-2xl mb-4 text-gray-900">How Scoring Works</h2><div class="space-y-6">
                <div class="flex gap-4"><div class="text-3xl bg-blue-50 w-14 h-14 rounded-2xl flex items-center justify-center">📉</div><div><h4 class="font-black text-gray-900">Rarity Score</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">MEGA RARE < 2%, RARE < 10%, SCARCE < 20%, UNCOMMON < 30%.</p></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-yellow-50 w-14 h-14 rounded-2xl flex items-center justify-center">🟡</div><div><h4 class="font-black text-gray-900">Birdseed</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">Earn 1 seed for every 10,000 cumulative points (from all checklists!). Use seed to buy eggs in the Nest.</p></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-purple-50 w-14 h-14 rounded-2xl flex items-center justify-center">✨</div><div><h4 class="font-black text-gray-900">Novelty Bonuses</h4><ul class="text-[11px] text-gray-500 space-y-1 mt-1 font-bold"><li>✨ <span class="text-green-600 uppercase tracking-tighter">Life Bird:</span> 4x bonus</li><li>🐦 <span class="text-blue-500 uppercase tracking-tighter">2nd Sighting:</span> 2x bonus</li></ul></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-green-50 w-14 h-14 rounded-2xl flex items-center justify-center">🔢</div><div><h4 class="font-black text-gray-900">Observation Multiplier</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">Every bird counts! Independent sightings of a species count towards your score.</p></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-emerald-50 w-14 h-14 rounded-2xl flex items-center justify-center">🐦</div><div><h4 class="font-black text-gray-900">Bird of the Week</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">Each Monday, a notable bird from your recent region becomes the Bird of the Week. Find it in any checklist that week to double ALL of your scores for the rest of the week!</p></div></div>
            </div><button onclick="state.showHowItWorks=false;render()" class="w-full bg-gray-900 text-white mt-10 py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-blue-600 transition-all">Got it</button></div></div>`;
        }


        function renderUsernamePrompt() {
            return `
            <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
                <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
                    <div class="text-5xl mb-4 text-center">🐦</div>
                    <h2 class="font-black text-2xl mb-2 text-gray-900 text-center">Connect eBird</h2>
                    <p class="text-gray-400 text-sm mb-6 text-center leading-relaxed">Enter your eBird username to fetch your checklists directly — no more CSV downloads!</p>
                    <input id="eBirdUsernameInput" type="text" placeholder="Your eBird username"
                        class="w-full border-2 p-4 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold text-gray-800 mb-3 text-center"
                        onkeydown="if(event.key==='Enter') saveeBirdUsername(document.getElementById('eBirdUsernameInput').value)" />
                    <p class="text-[10px] text-gray-400 text-center mb-6 font-bold">Enter your display name exactly as it appears on your eBird profile page — not your email address.</p>
                    <button onclick="saveeBirdUsername(document.getElementById('eBirdUsernameInput').value)"
                        class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 mb-3">
                        Connect Account →
                    </button>
                    <button onclick="state.showUsernamePrompt=false; render()"
                        class="w-full text-gray-400 font-black uppercase text-xs tracking-widest py-2">
                        Cancel
                    </button>
                </div>
            </div>`;
        }

        function renderChecklistPicker() {
            let body = '';

            if (state.checklistPickerLoading) {
                body = `<div class="text-center py-16 animate-pulse">
                    <div class="text-5xl mb-4">🔍</div>
                    <div class="font-black text-gray-400 uppercase tracking-widest text-sm">Fetching checklists...</div>
                </div>`;
            } else if (state.checklistPickerError) {
                body = `<div class="text-center py-10">
                    <div class="text-4xl mb-3">⚠️</div>
                    <div class="font-bold text-red-500 text-sm mb-6">${state.checklistPickerError}</div>
                    <button onclick="state.eBirdUsername=null; state.checklistPickerError=null; state.showChecklistPicker=false; state.showUsernamePrompt=true; render()"
                        class="text-xs font-black uppercase tracking-widest text-blue-500 border-2 border-blue-200 px-6 py-3 rounded-2xl">
                        Change Username
                    </button>
                </div>`;
            } else {
                body = `<div class="space-y-3">
                    ${state.eBirdChecklists.map(cl => {
                        const date = cl.obsDt || 'Unknown date';
                        const loc = cl.loc?.name || cl.locName || 'Unknown location';
                        const numSpecies = cl.numSpecies || '?';
                        const isLoading = state.fetchingChecklist === cl.subId;
                        const region = (cl.loc && cl.loc.subnational2Name) ? cl.loc.subnational2Name : "";
                        const isoDate = cl.isoObsDate || "";
                        return `
                        <button onclick="handleChecklistSelect(this)"
                            data-subid="${cl.subId}" data-isodate="${isoDate}" data-region="${region}" data-loc="${loc}"
                            class="w-full text-left bg-gray-50 hover:bg-blue-50 border-2 hover:border-blue-300 rounded-2xl p-4 transition-all active:scale-95 ${isLoading ? 'opacity-50 pointer-events-none' : ''}">
                            <div class="flex justify-between items-center gap-3">
                                <div class="flex-1 min-w-0">
                                    <div class="font-black text-gray-900 text-sm leading-tight">${loc}</div>
                                    <div class="text-[11px] text-gray-400 font-bold mt-1">📅 ${date}</div>
                                </div>
                                <div class="text-right flex-shrink-0">
                                    ${isLoading
                                        ? `<div class="text-xs font-black text-blue-500 animate-pulse">Loading...</div>`
                                        : `<div class="text-xl font-black text-blue-600">${numSpecies}</div>
                                           <div class="text-[10px] text-gray-400 font-bold uppercase">species</div>`
                                    }
                                </div>
                            </div>
                        </button>`;
                    }).join('')}
                </div>`;
            }

            return `
            <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl flex flex-col" style="max-height: 85vh">
                    <div class="p-6 border-b flex justify-between items-center flex-shrink-0">
                        <div>
                            <h2 class="font-black text-xl text-gray-900">My Checklists</h2>
                            <div class="text-[11px] text-gray-400 font-bold mt-0.5">@${state.eBirdUsername}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="state.eBirdUsername=null; state.showChecklistPicker=false; state.showUsernamePrompt=true; render()"
                                class="text-[10px] font-black uppercase tracking-widest text-gray-400 border border-gray-200 px-3 py-1.5 rounded-xl">
                                Change
                            </button>
                            <button onclick="state.showChecklistPicker=false; render()"
                                class="text-[10px] font-black uppercase tracking-widest text-gray-400 border border-gray-200 px-3 py-1.5 rounded-xl">
                                ✕
                            </button>
                        </div>
                    </div>
                    <div class="overflow-y-auto flex-1 p-4">
                        ${body}
                    </div>
                </div>
            </div>`;
        }

        loadData();
    </script>
</body>
</html>
