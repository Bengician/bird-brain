    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }

        /* Splash screen */
        #splash {
            position: fixed; inset: 0; z-index: 9999;
            background: #14532d;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.6s ease-out;
        }
        #splash.hiding { opacity: 0; pointer-events: none; }
        #splash-bird {
            opacity: 0;
            transform: translateX(-120vw) translateY(30px) scaleX(-1);
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.3s ease-out;
            filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
        }
        #splash-bird.flying-in {
            opacity: 1;
            transform: translateX(0) translateY(0) scaleX(-1);
        }
        #splash-bird.flying-out {
            opacity: 0;
            transform: translateX(80vw) translateY(-40px) scaleX(-1);
            transition: transform 0.7s cubic-bezier(0.55, 0, 1, 0.45),
                        opacity 0.4s ease-in;
        }
        #splash-title {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            margin-top: 28px;
            color: rgba(255,255,255,0.92);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #splash-title.visible { opacity: 1; transform: translateY(0); }

        /* App fade-in after splash */
        #app { opacity: 0; transition: opacity 0.5s ease-out; }
        #app.visible { opacity: 1; }

        /* Install banner */
        #install-banner {
            position: fixed; bottom: 80px; left: 12px; right: 12px; z-index: 200;
            background: #14532d; color: white;
            border-radius: 20px; padding: 14px 18px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            transform: translateY(120px); opacity: 0;
            transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.4s ease;
        }
        #install-banner.show { transform: translateY(0); opacity: 1; }
        
        /* Economy Animations */
        @keyframes seedPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #facc15; }
            100% { transform: scale(1); }
        }
        .seed-animate { animation: seedPop 0.5s ease-out; }
        
        /* Hatching Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .animate-shake { animation: shake 0.5s; animation-iteration-count: infinite; }
        
        .egg-gradient { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0.05) 100%); }

        /* Bird of the Week Found - Celebration Animations */
        @keyframes botwBgPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes botwBirdFly {
            0%   { transform: translateY(0px) rotate(-5deg) scale(1); }
            25%  { transform: translateY(-18px) rotate(5deg) scale(1.1); }
            50%  { transform: translateY(-8px) rotate(-3deg) scale(1.05); }
            75%  { transform: translateY(-22px) rotate(6deg) scale(1.12); }
            100% { transform: translateY(0px) rotate(-5deg) scale(1); }
        }
        @keyframes botwSlideUp {
            from { opacity: 0; transform: translateY(60px) scale(0.85); }
            to   { opacity: 1; transform: translateY(0px) scale(1); }
        }
        @keyframes botwTitlePop {
            0%   { opacity: 0; transform: scale(0.4) rotate(-8deg); }
            60%  { transform: scale(1.15) rotate(3deg); }
            80%  { transform: scale(0.95) rotate(-1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes botwConfetti {
            0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(120px) rotate(720deg); opacity: 0; }
        }
        @keyframes botwStarSpin {
            0%   { transform: rotate(0deg) scale(0); opacity: 0; }
            50%  { transform: rotate(180deg) scale(1.3); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }
        @keyframes botwGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(52, 211, 153, 0.4), 0 0 60px rgba(52, 211, 153, 0.2); }
            50%       { box-shadow: 0 0 40px rgba(52, 211, 153, 0.8), 0 0 100px rgba(52, 211, 153, 0.4); }
        }
        @keyframes botwScoreCount {
            from { transform: scale(1.5); color: #fbbf24; }
            to   { transform: scale(1);   color: #065f46; }
        }
        @keyframes botwShimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes botwRipple {
            0%   { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }
        .botw-modal-enter { animation: botwSlideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .botw-bird-fly    { animation: botwBirdFly 1.8s ease-in-out infinite; }
        .botw-title-pop   { animation: botwTitlePop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both; }
        .botw-star-spin   { animation: botwStarSpin 0.6s ease-out forwards; }
        .botw-glow        { animation: botwGlow 2s ease-in-out infinite; }
        .botw-shimmer-text {
            background: linear-gradient(90deg, #065f46, #34d399, #fbbf24, #34d399, #065f46);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: botwShimmer 2s linear infinite;
        }
        .confetti-piece { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: botwConfetti 1.5s ease-in forwards; }

        /* Rarity Reveal */
        @keyframes cardReveal {
            0%   { opacity: 0; transform: translateY(18px) scale(0.92); }
            65%  { transform: translateY(-3px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes scoreSlam {
            0%   { transform: scale(2.2); opacity: 0; color: #fbbf24; }
            60%  { transform: scale(0.92); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes rarityBadgePop {
            0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
            70%  { transform: scale(1.25) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes megaGlow {
            0%, 100% { box-shadow: 0 0 12px 2px rgba(168,85,247,0.55); }
            50%       { box-shadow: 0 0 28px 6px rgba(168,85,247,0.85); }
        }
        @keyframes rareGlow {
            0%, 100% { box-shadow: 0 0 10px 2px rgba(239,68,68,0.45); }
            50%       { box-shadow: 0 0 22px 5px rgba(239,68,68,0.75); }
        }
        @keyframes totalScoreCount {
            0%   { transform: scale(1.5); opacity: 0.4; }
            100% { transform: scale(1);   opacity: 1; }
        }
        .card-reveal      { animation: cardReveal 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .score-slam       { animation: scoreSlam 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .rarity-badge-pop { animation: rarityBadgePop 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .mega-glow        { animation: megaGlow 1.4s ease-in-out infinite; }
        .rare-glow        { animation: rareGlow 1.4s ease-in-out infinite; }
        .total-score-anim { animation: totalScoreCount 0.4s ease-out both; }

        /* Level-up splash */
        @keyframes levelUpEntry {
            0%   { opacity: 0; transform: scale(0.6) translateY(40px); }
            65%  { transform: scale(1.05) translateY(-6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes rankNameSlam {
            0%   { opacity: 0; transform: scale(2) rotate(-4deg); letter-spacing: 0.4em; }
            60%  { transform: scale(0.96) rotate(1deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes levelUpShimmer {
            0%   { background-position: -300% center; }
            100% { background-position: 300% center; }
        }
        @keyframes levelUpPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.08); }
        }
        @keyframes starBurst {
            0%   { transform: scale(0) rotate(0deg);   opacity: 0; }
            50%  { transform: scale(1.4) rotate(180deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }
        .levelup-entry    { animation: levelUpEntry 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .rankname-slam    { animation: rankNameSlam 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both; }
        .levelup-shimmer  {
            background: linear-gradient(90deg, #fff, #fde68a, #fff, #fbbf24, #fff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: levelUpShimmer 2s linear infinite;
        }
        .levelup-pulse    { animation: levelUpPulse 1.6s ease-in-out infinite; }
        .star-burst       { animation: starBurst 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }

    <script>

        // --- SPLASH SCREEN ---
        function playTweetSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const play = (freq, start, dur, type='sine', gain=0.18) => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.connect(g); g.connect(ctx.destination);
                    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                    osc.frequency.linearRampToValueAtTime(freq * 1.18, ctx.currentTime + start + dur * 0.4);
                    osc.frequency.linearRampToValueAtTime(freq * 0.92, ctx.currentTime + start + dur);
                    g.gain.setValueAtTime(0, ctx.currentTime + start);
                    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.015);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + dur + 0.01);
                };
                // Three-note chirp: classic passerine tweet
                play(2800, 0.00, 0.10, 'sine', 0.16);
                play(3200, 0.08, 0.08, 'sine', 0.14);
                play(2600, 0.15, 0.14, 'sine', 0.18);
                // Soft harmonic underneath
                play(1400, 0.00, 0.22, 'sine', 0.06);
                // Second phrase after a short pause
                play(3000, 0.38, 0.10, 'sine', 0.14);
                play(3400, 0.46, 0.10, 'sine', 0.12);
                play(2800, 0.54, 0.16, 'sine', 0.15);
            } catch(e) {}
        }

        function runSplash() {
            const splash = document.getElementById('splash');
            const bird   = document.getElementById('splash-bird');
            const title  = document.getElementById('splash-title');
            const app    = document.getElementById('app');

            // Only show splash when launched as installed PWA or first visit
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                              || window.navigator.standalone;
            const seenSplash = sessionStorage.getItem('bb_splash_shown');

            if (!isStandalone && seenSplash) {
                splash.style.display = 'none';
                app.classList.add('visible');
                return;
            }
            sessionStorage.setItem('bb_splash_shown', '1');

            // Bird flies in
            setTimeout(() => {
                bird.classList.add('flying-in');
                playTweetSound();
            }, 120);

            // Title fades up
            setTimeout(() => title.classList.add('visible'), 500);

            // Brief pause, then bird flies out and app reveals
            setTimeout(() => bird.classList.add('flying-out'), 1600);
            setTimeout(() => {
                splash.classList.add('hiding');
                app.classList.add('visible');
            }, 2100);
            setTimeout(() => splash.style.display = 'none', 2800);
        }

        // Run splash immediately
        runSplash();

        // --- PWA INSTALL PROMPT (Android/Chrome) ---
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
            const banner = document.getElementById('install-banner');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            if (!isStandalone && !localStorage.getItem('bb_install_dismissed')) {

        document.getElementById('install-btn').addEventListener('click', async () => {

            deferredInstallPrompt = null;

        document.querySelector('#install-banner button:last-child').addEventListener('click', () => {

        // --- CLOUD CONFIGURATION ---
        const SB_URL = 'https://hoblpnpkhbxqfurchiqo.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvYmxwbnBraGJ4cWZ1cmNoaXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NjgzNzksImV4cCI6MjA4MzM0NDM3OX0.poDCCTvbE-3wxTGanT_quIUw9F-hXoz2YAwVxoK7Kvw';

        /************************************************************
         * BIRD OF THE WEEK LOGIC
         ************************************************************/
        // Returns ISO string for the Monday that starts the current week
        function getCurrentWeekMonday() {
            const now = new Date();
            const day = now.getDay(); // 0=Sun, 1=Mon...
            const diff = (day === 0) ? -6 : 1 - day; // days back to Monday
            const monday = new Date(now);
            monday.setHours(0, 0, 0, 0);
            monday.setDate(now.getDate() + diff);
            return monday.toISOString().split('T')[0];
        }

        async function getRegionCodeForRegion(region) {
            try {
                const cleanRegion = region.trim();
                console.log('BotW: looking up region code for:', JSON.stringify(cleanRegion));

                // Try exact match first
                const { data, error } = await db
                    .from('d_region_codes')
                    .select('regionCode, Region')
                    .eq('Region', cleanRegion)
                    .maybeSingle();

                if (error) { console.error('Region code lookup error:', error); return null; }

                if (data?.regionCode) {
                    console.log('BotW: found region code:', data.regionCode);
                    return data.regionCode;
                }

                // Fallback: case-insensitive search across all rows
                console.warn('BotW: exact match failed, trying case-insensitive search...');
                const { data: allRows, error: allErr } = await db
                    .from('d_region_codes')
                    .select('regionCode, Region');

                if (allErr || !allRows) return null;

                console.log('BotW: all regions in table:', allRows.map(r => JSON.stringify(r.Region)));

                const match = allRows.find(r => r.Region.trim().toLowerCase() === cleanRegion.toLowerCase());
                if (match) {
                    console.log('BotW: case-insensitive match found:', match.Region, '->', match.regionCode);
                    return match.regionCode;
                }

                console.warn('BotW: no match found. Region from checklist:', JSON.stringify(cleanRegion));
                return null;
            } catch (e) { console.error('Region code error:', e); return null; }
        }

        // Returns { species, total } or { species: null, total: 0 } on no results, null on error
        async function fetchBirdOfWeek(regionCode, excludeList = []) {
            try {
                const resp = await fetch(
                    `https://api.ebird.org/v2/data/obs/${regionCode}/recent/notable?detail=simple`,
                    { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                );
                if (!resp.ok) { console.error('eBird edge function error:', resp.status); return null; }
                const observations = await resp.json();
                if (!observations || observations.length === 0) return { species: null, total: 0 };

                const allSpecies = [...new Set(observations.map(o => o.comName))];
                const total = allSpecies.length;

                // Try to pick one not in the exclusion list
                const candidates = allSpecies.length > 1
                    ? allSpecies.filter(s => !excludeList.includes(s))
                    : allSpecies;

                // If we've exhausted all options, pick from the full list
                const pool = candidates.length > 0 ? candidates : allSpecies;
                const species = pool[Math.floor(Math.random() * pool.length)];
                return { species, total };
            } catch (e) { console.error('eBird fetch error:', e); return null; }
        }

        function pickBird(luckMultiplier) {
            let targetRegion = state.lastRegion || Object.keys(state.regionSpeciesMap)[0];
            const speciesPool = state.regionSpeciesMap[targetRegion];

            const rollTier = () => {
                const rand = Math.random();
                let cumulative = 0;
                for (const tier of RARITY_TIERS) {
                    cumulative += tier.chance;
                    if (rand <= cumulative) return tier;
                }
                return RARITY_TIERS[4];
            };

            let bestTier = rollTier();
            const tierOrder = RARITY_TIERS.map(t => t.id);
            for (let i = 1; i < luckMultiplier; i++) {
                const newTier = rollTier();
                if (tierOrder.indexOf(newTier.id) < tierOrder.indexOf(bestTier.id)) bestTier = newTier;
            }

            let birdsInTier = speciesPool.filter(b => b.peak_frequency >= bestTier.min && b.peak_frequency < bestTier.max);
            if (birdsInTier.length === 0) {
                bestTier = RARITY_TIERS[4]; // Fallback to common
                birdsInTier = speciesPool.filter(b => b.peak_frequency >= bestTier.min);
            }

            const totalWeight = birdsInTier.reduce((sum, b) => sum + b.peak_frequency, 0);
            let birdRand = Math.random() * totalWeight;
            let winner = birdsInTier[0];
            for (const bird of birdsInTier) {
                birdRand -= bird.peak_frequency;
                if (birdRand <= 0) { winner = bird; break; }
            }

            return { species: winner.species, rarity: bestTier.id, rarity_color: bestTier.color, region: targetRegion };
        }

        /************************************************************
         * DATA PROCESSING
         ************************************************************/
        async function fetchFrequencyData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Bengician/bird-brain/main/frequency_data.json');
                const data = await response.json();
                const regionMap = {};
                Object.keys(data).forEach(key => {
                    const parts = key.split('_');
                    if (parts.length >= 3) {
                        const region = parts.slice(2).join('_');
                        const species = parts[0];
                        const info = data[key];
                        if (!regionMap[region]) regionMap[region] = [];
                        let existing = regionMap[region].find(b => b.species === species);
                        let currentVal = info.peak_frequency || info.frequency;
                        if (!existing) regionMap[region].push({ species, peak_frequency: currentVal });
                        else if (currentVal > existing.peak_frequency) existing.peak_frequency = currentVal;
                    }
                });
                state.frequencyData = data;
                state.regionSpeciesMap = regionMap; 
                state.regions = Object.keys(regionMap).sort();
            } catch (error) { console.error('Freq Error:', error); }
        }

        function weekOfYear(dateStr) {
            const date = new Date(dateStr);
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((Math.floor((date - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
        }

        function scoreObservation(species, date, count, history, freqData, region) {
            const week = weekOfYear(date);
            const info = freqData[`${species}_${week}_${region}`];
            if (!info) return { species_code: species, score: 0, error: true };
            
            const base = 10 * Math.log10(1 / Math.max(info.frequency, 0.001));
            const season = info.frequency < 0.25 * info.peak_frequency ? 1.5 : 1.0;
            const prevCount = history.filter(h => h.species_code === species).length;
            const novelty = prevCount === 0 ? 4.0 : (prevCount === 1 ? 2.0 : 1.0);
            const final = Math.round(base * season * novelty * count * 10);
            
            const tier = RARITY_TIERS.find(t => info.peak_frequency >= t.min && info.peak_frequency < t.max) || RARITY_TIERS[4];
            
            return {
                species_code: species, score: final, base_score: Math.round(base * 10),
                seasonal_bonus: season, novelty_multiplier: novelty, count_multiplier: count,
                rarity: tier.id, rarity_color: tier.color, frequency: info.frequency, 
                is_first: prevCount === 0, is_second: prevCount === 1
            };
        }

        async function selecteBirdChecklist(subId, locName, isoObsDate, subnational2Name) {
            state.fetchingChecklist = subId;
            render();
            try {
                // Step 1: fetch the full checklist
                const resp = await fetch(
                    `https://api.ebird.org/v2/product/checklist/view/${subId}`,
                    { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                );
                if (!resp.ok) throw new Error(`eBird returned ${resp.status}`);
                const data = await resp.json();
                const date = isoObsDate ? isoObsDate.split(' ')[0] : new Date().toISOString().split('T')[0];

                // Step 2: collect all species codes from this checklist
                const obsList = data.obs || [];
                const speciesCodes = [...new Set(obsList.map(o => o.speciesCode).filter(Boolean))];

                // Step 3: translate species codes -> common names via eBird taxonomy endpoint
                // Our frequency data is keyed by common name, so we must translate first
                let codeToName = {};
                if (speciesCodes.length > 0) {
                    const taxResp = await fetch(
                        `https://api.ebird.org/v2/ref/taxonomy/ebird?fmt=json&species=${speciesCodes.join(',')}`,
                        { headers: { 'X-eBirdApiToken': EBIRD_API_KEY } }
                    );
                    if (taxResp.ok) {
                        const taxData = await taxResp.json();
                        taxData.forEach(t => { codeToName[t.speciesCode] = t.comName; });
                    }
                }

                // Step 4: build observations using common names for scoring
                const observations = obsList.map(o => ({
                    species: codeToName[o.speciesCode] || o.speciesCode, // fallback to code if lookup fails
                    speciesCode: o.speciesCode,
                    date,
                    count: (o.howManyStr && o.howManyStr.toUpperCase() !== 'X') ? parseInt(o.howManyStr, 10) || 1 : 1
                }));

                state.showChecklistPicker = false;
                state.fetchingChecklist = null;
                await processeBirdChecklist(observations, date, locName, subnational2Name);
            } catch (e) {
                state.fetchingChecklist = null;
                state.checklistPickerError = `Could not load checklist: ${e.message}`;
                render();
            }
        }

        async function processeBirdChecklist(observations, date, locName, subnational2Name) {
            // locName is the specific eBird location (e.g. "Kalamalka Lake (Vernon)")
            // We need to match it to one of our scoring regions (e.g. "North Okanagan")
            // Try exact match first, then partial, then fall back to lastRegion, then prompt
            console.log('processeBirdChecklist: locName =', JSON.stringify(locName));
            console.log('processeBirdChecklist: available regions =', state.regions);
            console.log('processeBirdChecklist: lastRegion =', state.lastRegion);

            // subnational2Name (e.g. "North Okanagan") is the most reliable match
            let matchedRegion = subnational2Name
                ? state.regions.find(r => r.toLowerCase() === subnational2Name.toLowerCase())
                : null;
            // Fall back to matching against the specific location name
            if (!matchedRegion) {
                matchedRegion = state.regions.find(r => r.toLowerCase() === locName.toLowerCase());
            }
            if (!matchedRegion) {
                matchedRegion = state.regions.find(r =>
                    locName.toLowerCase().includes(r.toLowerCase()) ||
                    r.toLowerCase().includes(locName.toLowerCase().split(',')[0].trim())
                );
            }

            console.log('processeBirdChecklist: matchedRegion =', matchedRegion);

            if (!matchedRegion) {
                if (state.lastRegion) {
                    console.log('processeBirdChecklist: falling back to lastRegion =', state.lastRegion);
                    matchedRegion = state.lastRegion;
                } else {
                    console.log('processeBirdChecklist: no match, showing region prompt');
                    state.pendingeBirdObservations = { observations, date, locName };
                    state.showRegionPrompt = true;
                    render();
                    return;
                }
            }

            await scoreFetchedChecklist(observations, date, matchedRegion);
        }

        async function scoreFetchedChecklist(observations, date, region) {
            const currentTotalScore = state.checklists.reduce((sum, c) => sum + c.total_score, 0);
            const previousSeeds = Math.floor(currentTotalScore / 10000);

            const results = [];
            const tempHistory = [...state.userHistory];
            let total = 0;

            console.log('scoreFetchedChecklist: region =', region, '| date =', date, '| obs count =', observations.length);
            for (const obs of observations) {
                const { species, count } = obs;
                if (!species) continue;
                const week = weekOfYear(date);
                const freqKey = `${species.trim()}_${week}_${region}`;
                const freqHit = state.frequencyData[freqKey];
                if (!freqHit) console.warn('No freq data for key:', JSON.stringify(freqKey));
                const res = scoreObservation(
                    species.trim(),
                    date,
                    isNaN(count) ? 1 : count,
                    tempHistory,
                    state.frequencyData,
                    region
                );
                results.push(res);
                total += res.score;
                if (!res.error) {
                    for (let i = 0; i < count; i++) {
                        tempHistory.push({ date, species_code: species.trim() });
                    }
                }
            }
            console.log('scoreFetchedChecklist: total =', total, '| results sample =', results.slice(0,3));

            const seedsEarnedNow = Math.max(0, Math.floor((currentTotalScore + total) / 10000) - previousSeeds);
            state.birdseed += seedsEarnedNow;

            // --- Level-up check ---
            const newTotalScore = currentTotalScore + total;
            const oldRank = getRankForScore(currentTotalScore);
            const newRank = getRankForScore(newTotalScore);
            let levelUpEvent = null;
            if (newRank.level > oldRank.level) {
                state.birdseed += newRank.seedBonus;
                levelUpEvent = { newRank, seedBonus: newRank.seedBonus };
            }

            // Check Bird of the Week
            const botWFound = checkBirdOfWeekFound(results);
            let appliedBotW = false;
            if (botWFound) {
                state.birdOfWeek.found = true;
                appliedBotW = true;
                state.showBirdOfWeekFound = true;
            }

            const botWActive = state.birdOfWeek && state.birdOfWeek.found && state.birdOfWeek.weekStart === getCurrentWeekMonday();
            if (botWActive) {
                total = 0;
                results.forEach(o => {
                    o.score = o.score * 2;
                    o.botw_doubled = true;
                    total += o.score;
                });
            }

            state.checklists = [{
                id: Date.now(),
                date,
                region,
                total_score: total,
                species_count: results.length,
                observations: results,
                seed_earned: seedsEarnedNow,
                botw_applied: botWActive,
                botw_unlocked: appliedBotW
            }, ...state.checklists];

            state.lastRegion = region;
            state.userHistory = tempHistory;
            state.currentResult = state.checklists[0];
            state.pendingeBirdObservations = null;
            await saveData();
            initBirdOfWeek();
            // Kick off the rarity reveal sequence, then level-up splash if applicable
            state.view = 'home';
            setTimeout(() => startReveal(state.checklists[0], levelUpEvent), 80);
        }

        /************************************************************
         * SOUND EFFECTS
         ************************************************************/
        // Shared AudioContext — reuse across calls to avoid hitting browser limits
        let _audioCtx = null;
        function getAudioCtx() {
            if (!_audioCtx || _audioCtx.state === 'closed') {
                _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (_audioCtx.state === 'suspended') _audioCtx.resume();
            return _audioCtx;
        }

        function playNote(ctx, freq, start, dur, type = 'sine', gain = 0.2) {
            const osc = ctx.createOscillator();
            const g   = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
            g.gain.setValueAtTime(0, ctx.currentTime + start);
            g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.015);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
            osc.start(ctx.currentTime + start);
            osc.stop(ctx.currentTime + start + dur + 0.01);
        }

                    playNote(ctx, 659,  0.24, 0.14, 'triangle', 0.30);
                    playNote(ctx, 784,  0.36, 0.14, 'triangle', 0.32);
                    playNote(ctx, 1047, 0.48, 0.45, 'triangle', 0.38);
                    playNote(ctx, 659,  0.48, 0.45, 'sine',     0.16);
                    playNote(ctx, 1319, 0.70, 0.18, 'sine',     0.16);

                } else if (rarity === 'RARE') {
                    // Bright double-chime

                } else if (rarity === 'SCARCE') {

                    playNote(ctx, 523,  0.00, 0.14, 'triangle', 0.15);
                    playNote(ctx, 659,  0.12, 0.22, 'sine',     0.11);

        function playEggCrackingSound() {
            try {
                const ctx = getAudioCtx();
                // Low rumble using noise
                const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.max(0, 1 - i / (ctx.sampleRate * 1.8));
                }
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 160;
                filter.Q.value = 0.7;
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.15, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.9);
                src.connect(filter); filter.connect(g); g.connect(ctx.destination);
                src.start();
                // Cracking impact thumps at irregular intervals
                [0.25, 0.6, 0.88, 1.15, 1.45, 1.72].forEach(t => {
                    playNote(ctx, 90 + Math.random() * 50,  t,        0.09, 'sawtooth', 0.20);
                    playNote(ctx, 220 + Math.random() * 80, t + 0.02, 0.05, 'square',   0.07);
                });
            } catch(e) {}
        }

                    [262, 330, 392, 523, 659, 784, 1047].forEach((freq, i) => {

        /************************************************************
         * RARITY REVEAL SEQUENCE
         ************************************************************/
        const RARITY_ORDER = ['MEGA RARE', 'RARE', 'SCARCE', 'UNCOMMON', 'COMMON', undefined, null];

        function rarityRank(r) {
            const i = RARITY_ORDER.indexOf(r);
            return i === -1 ? 99 : i;
        }

        function startReveal(checklist, levelUpEvent) {
            // Sort: commons first, rarest last — drama builds to a climax
            const sorted = [...checklist.observations].sort(
                (a, b) => rarityRank(a.rarity) - rarityRank(b.rarity)
            ).reverse(); // reverse so common = index 0, mega rare = last

            state.reveal = {
                checklistId: checklist.id,
                visibleObs: [],
                done: false,
                animatedScore: 0
            };
            render();

            // Scroll to bottom so the checklist reveal is fully visible
            setTimeout(() => window.scrollTo({ top: 999999, behavior: 'smooth' }), 80);

            let delay = 0;
            sorted.forEach((obs, i) => {
                const isLast   = i === sorted.length - 1;
                // Pacing: common=160ms gap, uncommon=220, scarce=350, rare=500, mega=700
                const gapMs = ({ 'MEGA RARE': 700, 'RARE': 500, 'SCARCE': 350, 'UNCOMMON': 220 })[obs.rarity] || 160;

                setTimeout(() => {
                    state.reveal.visibleObs = sorted.slice(0, i + 1);
                    // Partial render — just re-draw the home view content
                    const app = document.getElementById('app');
                    if (app) {
                        const totalScore = state.checklists.reduce((s, c) => s + c.total_score, 0);
                        const stats = { obs: state.userHistory.length, spec: new Set(state.userHistory.map(h => h.species_code)).size, score: totalScore };
                        // Only re-render the main content area to avoid killing modals
                        const main = app.querySelector('.reveal-host');
                        if (main) {
                            main.innerHTML = renderHome(stats);
                            window.scrollTo({ top: 999999, behavior: 'smooth' });
                        }
                    }
                    playRaritySound(obs.rarity);

                    if (isLast) {
                        setTimeout(() => animateTotalScore(checklist.total_score, levelUpEvent), 250);
                    }
                }, delay);

                delay += gapMs;
            });
        }

        function animateTotalScore(target, levelUpEvent) {
            const duration = 1100;
            const startTime = performance.now();
            let lastTickAt = 0;

            function tick(now) {
                const elapsed  = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased    = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                const current  = Math.round(eased * target);
                state.reveal.animatedScore = current;

                // Tick sound every ~60pts gap, throttled
                if (current - lastTickAt >= 60) {
                    playScoreTick();
                    lastTickAt = current;
                }

                // Update the score element directly — no full re-render
                const el = document.getElementById('reveal-total-score');
                if (el) el.textContent = current.toLocaleString();

                if (progress < 1) {
                    requestAnimationFrame(tick);
                } else {
                    state.reveal.animatedScore = target;
                    state.reveal.done = true;
                    playRevealCompleteSound();
                    render(); // final full render
                    // Show level-up splash after a short pause if applicable
                    if (levelUpEvent) {
                        setTimeout(() => {
                            state.rankLevel = levelUpEvent.newRank.level;
                            state.levelUpData = levelUpEvent;
                            state.showLevelUp = true;
                            saveData();
                            render();
                            playLevelUpSound(levelUpEvent.newRank.level);
                        }, 600);
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        function playLevelUpSound(level) {
            try {
                const ctx = getAudioCtx();
                // Each level gets a grander fanfare
                const base = [261, 294, 330, 349, 392]; // C D E F G
                // Rising arpeggio speed and pitch scales with level
                const notes = [
                    [392, 494, 587, 784],               // Birder - simple
                    [392, 494, 587, 740, 880],           // Expert - add 2 notes
                    [349, 440, 523, 659, 880, 1047],     // Ornithologist
                    [330, 415, 523, 659, 830, 1047, 1319], // Legend
                    [262, 330, 392, 494, 587, 740, 880, 1047, 1319], // Max
                ][Math.min(level - 1, 4)];

                notes.forEach((freq, i) => {
                    const isLast = i === notes.length - 1;
                    playNote(ctx, freq, i * 0.11, isLast ? 0.9 : 0.15, 'triangle', isLast ? 0.38 : 0.22);
                    if (isLast) {
                        // Harmony on final note
                        playNote(ctx, freq * 1.25, i * 0.11, 0.9, 'sine', 0.15);
                        playNote(ctx, freq * 1.5,  i * 0.11, 0.9, 'sine', 0.10);
                    }
                });
                // Shimmer tail
                const tailStart = notes.length * 0.11 + 0.3;
                playNote(ctx, 1568, tailStart,        0.15, 'sine', 0.10);
                playNote(ctx, 2093, tailStart + 0.12, 0.20, 'sine', 0.08);
            } catch(e) {}
        }

        async function loadLeaderboard() {
            state.leaderboard.loading = true;
            render();
            try {
                const { data, error } = await db
                    .from('checklist_data')
                    .select('username, data, history');
                if (error || !data) throw new Error('Query failed');

                const now = new Date();
                const weekStart = getCurrentWeekMonday();
                const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;

                const rows = data.map(row => {
                    const checklists = row.data?.checklists || [];

                    const scoreFor = (clists) => clists.reduce((s, c) => s + (c.total_score || 0), 0);
                    const speciesFor = (clists) => new Set(
                        clists.flatMap(c => (c.observations||[]).map(o => o.species_code))
                    ).size;
                    const topChecklistFor = (clists) => clists.reduce((best, c) =>
                        (c.total_score||0) > (best?.total_score||0) ? c : best, null);

                    const weekClists  = checklists.filter(c => c.date >= weekStart);
                    const monthClists = checklists.filter(c => c.date >= monthStart);

                    // Best single rare observation across all checklists
                    const allObs = checklists.flatMap(c => c.observations || []);
                    const rareObs = allObs
                        .filter(o => ['MEGA RARE','RARE','SCARCE'].includes(o.rarity))
                        .sort((a,b) => (b.score||0) - (a.score||0))[0] || null;

                    const totalScore = scoreFor(checklists);
                    const rank = getRankForScore(totalScore);

                    return {
                        username: row.username,
                        allScore:   totalScore,
                        weekScore:  scoreFor(weekClists),
                        monthScore: scoreFor(monthClists),
                        allSpecies:   speciesFor(checklists),
                        weekSpecies:  speciesFor(weekClists),
                        monthSpecies: speciesFor(monthClists),
                        checklistCount: checklists.length,
                        weekChecklistCount: weekClists.length,
                        topChecklist: topChecklistFor(checklists),
                        rareObs,
                        rank,
                        isCurrentUser: row.username === state.currentUser
                    };
                });

                state.leaderboard.data = rows;
                state.leaderboard.loaded = true;
            } catch(e) {
                console.error('Leaderboard error:', e);
            }
            state.leaderboard.loading = false;
            render();
        }

        /************************************************************
         * BIRD OF THE WEEK - RE-ROLL & CELEBRATION
         ************************************************************/
        async function rerollBirdOfWeek() {
            if (state.birdOfWeekLoading || !state.birdOfWeek) return;
            const regionCode = state.birdOfWeek.regionCode;

            // Track all species seen so far this week to avoid repeats
            const seenSpecies = [...(state.birdOfWeek.seenSpecies || []), state.birdOfWeek.species];

            state.birdOfWeekLoading = true;
            state.birdOfWeekError = null;
            render();

            const result = await fetchBirdOfWeek(regionCode, seenSpecies);

            if (!result) {
                state.birdOfWeekError = 'Could not reach the eBird service. Please try again.';
            } else if (result.total === 0) {
                state.birdOfWeekError = 'No notable birds have been reported in your region recently.';
            } else {
                state.birdOfWeek = {
                    species: result.species,
                    weekStart: getCurrentWeekMonday(),
                    regionCode,
                    region: state.birdOfWeek.region,
                    found: false,
                    seenSpecies  // carry forward the history so future re-rolls keep avoiding these
                };
                await saveData();
            }

            state.birdOfWeekLoading = false;
            render();
        }

        function playBirdFoundSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();

                const playNote = (freq, start, duration, type = 'sine', gain = 0.3) => {
                    const osc = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
                    gainNode.gain.setValueAtTime(0, ctx.currentTime + start);
                    gainNode.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
                    osc.start(ctx.currentTime + start);
                    osc.stop(ctx.currentTime + start + duration);
                };

                // Triumphant fanfare: ascending arpeggio then chord
                playNote(523.25, 0.0,  0.18, 'triangle', 0.35); // C5
                playNote(659.25, 0.15, 0.18, 'triangle', 0.35); // E5
                playNote(783.99, 0.30, 0.18, 'triangle', 0.35); // G5
                playNote(1046.5, 0.45, 0.40, 'triangle', 0.40); // C6
                // Harmony layer
                playNote(659.25, 0.45, 0.40, 'sine', 0.20);     // E5
                playNote(783.99, 0.45, 0.40, 'sine', 0.18);     // G5
                // Sparkle flourish
                playNote(1318.5, 0.80, 0.12, 'sine', 0.15);     // E6
                playNote(1568.0, 0.90, 0.12, 'sine', 0.15);     // G6
                playNote(2093.0, 1.00, 0.25, 'sine', 0.12);     // C7
                // Final big chord
                playNote(523.25, 1.20, 0.6, 'triangle', 0.25);
                playNote(659.25, 1.20, 0.6, 'triangle', 0.22);
                playNote(783.99, 1.20, 0.6, 'triangle', 0.20);
                playNote(1046.5, 1.20, 0.6, 'triangle', 0.30);
            } catch(e) { console.log('Audio not available', e); }
        }

        function renderObservationRow(o, i, viewType, isReveal) {
            const uniqueId = `${viewType}_${o.species_code}_${i}`, isExpanded = state.expandedSpeciesId === uniqueId;

            const badgeClass = isReveal ? 'rarity-badge-pop' : '';
            return `<div class="border-2 border-${o.rarity_color}-100 bg-${o.rarity_color}-50 rounded-2xl overflow-hidden mb-2 transition-all ${revealClass} ${glowClass}">

                    <div class="flex items-center gap-2 mt-0.5">${o.is_first ? '<span class="text-[10px] font-black text-green-600 uppercase tracking-tighter">Life Bird! (4x Bonus)</span>' : (o.is_second ? '<span class="text-[10px] font-black text-blue-500 uppercase tracking-tighter">2nd Sighting (2x Bonus)</span>' : '')}
                    ${o.count_multiplier > 1 ? `<span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded-md font-black border border-green-200 uppercase tracking-tighter">x${o.count_multiplier}</span>` : ''}</div></div>
                    <div class="font-black text-xl text-blue-800 ${scoreClass}">${o.score.toLocaleString()}</div>
                </button>
                ${isExpanded ? `<div class="p-4 border-t bg-white text-[11px] space-y-2 text-gray-600 animate-fadeIn">
                    <div class="flex justify-between"><span>Base Score (F: ${(o.frequency*100).toFixed(2)}%)</span><span class="font-bold text-blue-600">${o.base_score}</span></div>
                    <div class="flex justify-between"><span>Seasonal Multiplier</span><span class="font-bold text-orange-500">×${o.seasonal_bonus}</span></div>
                    <div class="flex justify-between"><span>Novelty Multiplier</span><span class="font-bold text-purple-600">×${o.novelty_multiplier}</span></div>
                    <div class="flex justify-between"><span>Observation Multiplier</span><span class="font-bold text-green-600">×${o.count_multiplier}</span></div>
                    ${o.botw_doubled ? `<div class="flex justify-between text-emerald-700"><span>🐦 Bird of the Week Bonus</span><span class="font-bold">×2</span></div>` : ''}
                    <div class="flex justify-between font-black border-t pt-2 text-gray-900 text-sm"><span>Final Points</span><span>${o.score.toLocaleString()}</span></div>
                </div>` : ''}</div>`;

        function renderHistory() {
            return `<div class="flex justify-between items-end mb-6"><h2 class="font-black text-3xl text-gray-900">History</h2><button onclick="if(confirm('Wipe History?')) { state.checklists=[]; state.userHistory=[]; state.birdseed=0; state.eggs=[]; state.birds=[]; saveData(); render(); }" class="text-[10px] font-black text-red-400 uppercase tracking-widest">Clear All</button></div>

        function renderHowItWorks() {
            return `<div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 z-50"><div class="bg-white rounded-[40px] p-8 max-w-md shadow-2xl relative"><h2 class="font-black text-2xl mb-4 text-gray-900">How Scoring Works</h2><div class="space-y-6">
                <div class="flex gap-4"><div class="text-3xl bg-blue-50 w-14 h-14 rounded-2xl flex items-center justify-center">📉</div><div><h4 class="font-black text-gray-900">Rarity Score</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">The rarer the bird, the higher the score! There are 5 tiers: COMMON birds earn you a modest base score, UNCOMMON birds start to turn heads, SCARCE birds raise eyebrows, RARE birds have your birding friends questioning your sanity, and MEGA RARE birds are the stuff of legend - seen in fewer than 2% of all checklists.</p></div></div>

                                👤
                            </button>
                            <button onclick="state.showChecklistPicker=false; render()"
                                class="text-[10px] font-black uppercase tracking-widest text-gray-400 border border-gray-200 px-3 py-1.5 rounded-xl">
                                ✕
                            </button>
                        </div>
                    </div>
                    <div class="overflow-y-auto flex-1 p-4">
                        ${body}
                    </div>
                </div>
            </div>`;
        }

        loadData();
    </script>
</body>
</html>
