<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird Brain</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
.glass{background:rgba(255,255,255,.95);backdrop-filter:blur(10px)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.animate-fadeIn{animation:fadeIn .2s ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.animate-pop{animation:pop .3s ease-out forwards}
</style>
</head>
<body>
<div id="app"></div>
<script>

const SB_URL='https://hoblpnpkhbxqfurchiqo.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvYmxwbnBraGJ4cWZ1cmNoaXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NjgzNzksImV4cCI6MjA4MzM0NDM3OX0.poDCCTvbE-3wxTGanT_quIUw9F-hXoz2YAwVxoK7Kvw';
const db=supabase.createClient(SB_URL,SB_KEY);

let state={
currentUser:null,
users:[],
checklists:[],
userHistory:[],
frequencyData:{},
regions:[],
currentResult:null,
view:'home',
showRegionPrompt:false,
expandedChecklistId:null,
expandedSpeciesId:null,
showUserSelect:false,
showManageUsers:false,
loading:true,
birdseed:0,
showBirdseedReward:false,
birdseedEarned:0,
eggsOwned:[]
};

async function loadData(){
state.loading=true;render();
try{
const{data:profiles}=await db.from('profiles').select('username');
if(profiles)state.users=profiles.map(p=>p.username);
await fetchFrequencyData();
const savedUser=localStorage.getItem('current_user');
if(savedUser&&state.users.includes(savedUser)){
await selectUser(savedUser);
}else state.showUserSelect=true;
}catch(e){console.error(e)}
state.loading=false;render();}

async function selectUser(username){
state.loading=true;render();
state.currentUser=username;
localStorage.setItem('current_user',username);
const{data}=await db.from('checklist_data').select('*').eq('username',username).maybeSingle();
state.checklists=data?.data||[];
state.userHistory=data?.history||[];
state.birdseed=data?.birdseed||0;
state.eggsOwned=data?.eggsOwned||[];
state.currentResult=state.checklists[0]||null;
state.showUserSelect=false;
state.loading=false;render();}

async function saveData(){
if(!state.currentUser)return;
await db.from('checklist_data').upsert({
username:state.currentUser,
data:state.checklists,
history:state.userHistory,
birdseed:state.birdseed,
eggsOwned:state.eggsOwned,
updated_at:new Date().toISOString()
},{onConflict:'username'});
}

async function fetchFrequencyData(){
const res=await fetch('https://raw.githubusercontent.com/Bengician/bird-brain/main/frequency_data.json');
const data=await res.json();
state.frequencyData=data;
const set=new Set();
Object.keys(data).forEach(k=>{const p=k.split('_');if(p.length>=3)set.add(p.slice(2).join('_'))});
state.regions=[...set].sort();}

function weekOfYear(d){const date=new Date(d);const start=new Date(date.getFullYear(),0,1);return Math.ceil((((date-start)/86400000)+start.getDay()+1)/7)}

function scoreObservation(species,date,count,history,freq,region){
const week=weekOfYear(date);
const key=`${species}_${week}_${region}`;
const info=freq[key];
if(!info)return{species_code:species,score:0,error:true};
const base=10*Math.log10(1/Math.max(info.frequency,.001));
const season=info.frequency<0.25*info.peak_frequency?1.5:1;
const prev=history.filter(h=>h.species_code===species).length;
let novelty=1;if(prev===0)novelty=4;else if(prev===1)novelty=2;
const final=Math.round(base*season*novelty*count*10);
return{species_code:species,score:final};}

let pendingFile=null;
async function handleUpload(e){pendingFile=e.target.files[0];if(pendingFile){state.showRegionPrompt=true;render()}e.target.value='';}

async function processChecklist(region){
let text=await pendingFile.text();
text=text.replace(/^\uFEFF/,'').trim();
const parsed=Papa.parse(text,{header:true,skipEmptyLines:true});
let total=0;let date=null;let results=[];let tempHistory=[...state.userHistory];
for(const row of parsed.data){
const species=row['Species'];
const obsDate=row['Observation Date'];
if(!species||!obsDate)continue;
let count=1;if(row['Count']&&row['Count']!=='X'){const c=parseInt(row['Count']);if(!isNaN(c))count=c}
if(!date)date=obsDate;
const res=scoreObservation(species.trim(),obsDate.trim(),count,tempHistory,state.frequencyData,region);
results.push(res);total+=res.score;
for(let i=0;i<count;i++)tempHistory.push({date:obsDate,species_code:species});
}

state.checklists=[{id:Date.now(),date,region,total_score:total,observations:results},...state.checklists];
state.userHistory=tempHistory;
state.currentResult=state.checklists[0];

const earned=Math.floor(total/10000);
if(earned>0){state.birdseed+=earned;state.birdseedEarned=earned;state.showBirdseedReward=true}

state.showRegionPrompt=false;
await saveData();render();}

async function purchaseEgg(price,name){
if(state.birdseed<price)return;
state.birdseed-=price;
state.eggsOwned.push(name);
await saveData();render();}

function render(){
const app=document.getElementById('app');
const stats={score:state.checklists.reduce((s,c)=>s+c.total_score,0)};
app.innerHTML=`
<div class="min-h-screen bg-gray-50 pb-24">
<div class="glass border-b p-4 flex justify-between items-center">
<h1 class="text-xl font-bold">🐦 Bird Brain</h1>
<div class="font-bold text-yellow-600">🌾 ${state.birdseed}</div>
</div>
<div class="max-w-2xl mx-auto p-4">
${state.loading?'<div>Loading...</div>':(
state.view==='home'?renderHome(stats):
state.view==='history'?renderHistory():
renderNest())}
</div>
<div class="fixed bottom-0 left-0 right-0 glass border-t flex justify-around p-2">
<button onclick="state.view='home';render()">🏆</button>
<button onclick="state.view='history';render()">📋</button>
<button onclick="state.view='nest';render()">🪺</button>
</div>
${state.showRegionPrompt?renderRegionPrompt():''}
${state.showBirdseedReward?renderBirdseedReward():''}
</div>`}

function renderHome(stats){
return`
<div class="bg-yellow-50 border p-4 rounded-xl mb-4 flex justify-between">
<div class="font-bold">Birdseed</div>
<div class="font-black text-yellow-600">🌾 ${state.birdseed}</div>
</div>
<label class="block mb-6 cursor-pointer">
<div class="bg-blue-600 text-white p-8 rounded-2xl text-center font-bold">Upload eBird CSV</div>
<input type="file" accept=".csv" onchange="handleUpload(event)" class="hidden" />
</label>
${state.currentResult?`<div class="bg-white p-4 rounded-xl shadow">Last Score: <span class="font-bold">${state.currentResult.total_score}</span></div>`:'No data'}
`}

function renderHistory(){
return`<div>${state.checklists.map(c=>`<div class="bg-white p-4 rounded-xl mb-3 shadow">${c.date} — ${c.total_score}</div>`).join('')}</div>`}

function renderNest(){
const store=[{name:'Common Egg',price:3},{name:'Rare Egg',price:7},{name:'Legendary Egg',price:15}];
return`
<h2 class="text-2xl font-bold mb-4">🪺 The Nest</h2>
<div class="mb-4 font-bold">🌾 ${state.birdseed} Birdseed</div>
<div class="space-y-3 mb-6">
${store.map(e=>`
<div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
<div><div class="font-bold">${e.name}</div><div class="text-sm">${e.price} 🌾</div></div>
<button onclick="purchaseEgg(${e.price},'${e.name}')" ${state.birdseed<e.price?'disabled':''} class="px-4 py-2 rounded bg-blue-600 text-white disabled:bg-gray-300">Buy</button>
</div>`).join('')}
</div>
<h3 class="font-bold">Your Eggs</h3>
${state.eggsOwned.length===0?'No eggs yet.':state.eggsOwned.map(e=>`<div class="bg-green-100 p-2 rounded mb-2">🥚 ${e}</div>`).join('')}
`}

function renderRegionPrompt(){
return`<div class="fixed inset-0 bg-black/70 flex items-center justify-center">
<div class="bg-white p-6 rounded-xl">
${state.regions.map(r=>`<div class="p-2 cursor-pointer" onclick="processChecklist('${r}')">${r}</div>`).join('')}
</div></div>`}

function renderBirdseedReward(){
return`<div class="fixed inset-0 bg-black/70 flex items-center justify-center">
<div class="bg-white p-10 rounded-3xl text-center animate-pop">
<div class="text-6xl">🌾</div>
<div class="text-2xl font-black mt-3">+${state.birdseedEarned} Birdseed!</div>
<button onclick="state.showBirdseedReward=false;render()" class="mt-4 bg-blue-600 text-white px-6 py-3 rounded-xl">Collect</button>
</div></div>`}

loadData();
</script>
</body>
</html>
