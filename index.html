<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
        
        /* Economy Animations */
        @keyframes seedPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #facc15; }
            100% { transform: scale(1); }
        }
        .seed-animate { animation: seedPop 0.5s ease-out; }
        
        /* Hatching Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .animate-shake { animation: shake 0.5s; animation-iteration-count: infinite; }
        
        @keyframes crackOpen {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .egg-gradient { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(0,0,0,0.05) 100%); }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // --- CLOUD CONFIGURATION ---
        const SB_URL = 'https://hoblpnpkhbxqfurchiqo.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvYmxwbnBraGJ4cWZ1cmNoaXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NjgzNzksImV4cCI6MjA4MzM0NDM3OX0.poDCCTvbE-3wxTGanT_quIUw9F-hXoz2YAwVxoK7Kvw';
        const db = supabase.createClient(SB_URL, SB_KEY);

        let state = {
            currentUser: null,
            users: [],
            checklists: [],
            userHistory: [], // Full observation history for scoring context
            // Economy Data
            birdseed: 0,
            eggs: [], 
            birds: [], 
            // App Data
            frequencyData: {},
            speciesList: [],
            regions: [],
            currentResult: null,
            view: 'home',
            showRegionPrompt: false,
            expandedChecklistId: null, 
            showHowItWorks: false,
            expandedSpeciesId: null,   
            showUserSelect: false,
            showManageUsers: false,
            // Hatching State
            hatchingEgg: null,
            isHatching: false,
            hatchResult: null,
            loading: true
        };

        const EGG_TYPES = [
            { id: 'common', name: 'Common Egg', cost: 1, color: 'bg-gray-200', emoji: '🥚', luck: 1 },
            { id: 'speckled', name: 'Speckled Egg', cost: 5, color: 'bg-blue-100', emoji: '🪺', luck: 1.5 },
            { id: 'golden', name: 'Golden Egg', cost: 20, color: 'bg-yellow-200', emoji: '✨', luck: 3 }
        ];

        /************************************************************
         * USER & CLOUD LOGIC (PERSISTENCE FIX)
         ************************************************************/
        async function loadData() {
            state.loading = true;
            render();
            try {
                // 1. Get Users
                const { data: profiles } = await db.from('profiles').select('username');
                if (profiles) state.users = profiles.map(p => p.username);

                // 2. Get Frequency Data
                await fetchFrequencyData();

                // 3. Auto-login if saved
                const savedUser = localStorage.getItem('current_user');
                if (savedUser && state.users.includes(savedUser)) {
                    await selectUser(savedUser);
                } else {
                    state.showUserSelect = true;
                }
            } catch (error) { 
                console.error('Initial load error:', error);
            }
            state.loading = false;
            render();
        }

        async function selectUser(username) {
            state.loading = true;
            render();
            state.currentUser = username;
            localStorage.setItem('current_user', username);
            try {
                // Fetch data from the standard columns 'data' and 'history'
                const { data } = await db.from('checklist_data').select('data, history').eq('username', username).maybeSingle();
                
                // --- MIGRATION LOGIC ---
                // The DB column 'data' used to be an Array. Now it is an Object containing { checklists, birdseed, eggs, birds }
                // We check if it is an array (Old Format) or Object (New Format)
                
                const rawData = data?.data;
                state.userHistory = data?.history || [];

                if (Array.isArray(rawData)) {
                    // OLD FORMAT: Just checklists
                    state.checklists = rawData || [];
                    state.birdseed = 0;
                    state.eggs = [];
                    state.birds = [];
                } else if (rawData && typeof rawData === 'object') {
                    // NEW FORMAT: Container object
                    state.checklists = rawData.checklists || [];
                    state.birdseed = rawData.birdseed || 0;
                    state.eggs = rawData.eggs || [];
                    state.birds = rawData.birds || [];
                } else {
                    // Empty or New User
                    state.checklists = [];
                    state.birdseed = 0;
                    state.eggs = [];
                    state.birds = [];
                }

                state.currentResult = state.checklists.length > 0 ? state.checklists[0] : null;

            } catch (error) { console.error("Load error:", error); }
            state.showUserSelect = false;
            state.showManageUsers = false;
            state.loading = false;
            render();
        }

        async function createUser(username) {
            if (!username || username.trim() === '') return alert('Enter a username');
            const cleanName = username.trim();
            const { error } = await db.from('profiles').insert([{ username: cleanName }]);
            if (error) return alert('User exists or DB error');
            state.users.push(cleanName);
            await selectUser(cleanName);
        }

        async function deleteUser(username) {
            if (!confirm(`Delete ${username}? Data cannot be recovered.`)) return;
            state.loading = true;
            render();
            await db.from('checklist_data').delete().eq('username', username);
            await db.from('profiles').delete().eq('username', username);
            state.users = state.users.filter(u => u !== username);
            if (state.currentUser === username) {
                state.currentUser = null;
                localStorage.removeItem('current_user');
                state.showUserSelect = true;
            }
            state.loading = false;
            render();
        }

        async function saveData() {
            if (!state.currentUser) return;
            
            // PACKING DATA: Store economy data INSIDE the 'data' JSON column
            // This prevents errors from trying to write to non-existent columns
            const packedData = {
                checklists: state.checklists,
                birdseed: state.birdseed,
                eggs: state.eggs,
                birds: state.birds
            };

            await db.from('checklist_data').upsert({
                username: state.currentUser,
                data: packedData, // Saving the wrapper object
                history: state.userHistory,
                updated_at: new Date().toISOString()
            }, { onConflict: 'username' });
        }

        /************************************************************
         * ECONOMY & HATCHING
         ************************************************************/
        function buyEgg(eggType) {
            if (state.birdseed >= eggType.cost) {
                state.birdseed -= eggType.cost;
                state.eggs.push({
                    ...eggType,
                    uuid: Date.now() + Math.random().toString(),
                    purchasedAt: new Date().toLocaleDateString()
                });
                saveData();
                render();
            } else {
                alert("Not enough birdseed!");
            }
        }

        function handleDragStart(e, eggUuid) {
            e.dataTransfer.setData("text/plain", eggUuid);
            e.dataTransfer.effectAllowed = "move";
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }

        async function handleDrop(e) {
            e.preventDefault();
            if (state.isHatching) return;
            const eggUuid = e.dataTransfer.getData("text/plain");
            const eggIndex = state.eggs.findIndex(egg => egg.uuid === eggUuid);
            
            if (eggIndex > -1) {
                const egg = state.eggs[eggIndex];
                state.eggs.splice(eggIndex, 1);
                state.hatchingEgg = egg;
                state.isHatching = true;
                render();
                setTimeout(() => { finalizeHatch(egg); }, 2000);
            }
        }

        function finalizeHatch(egg) {
            const hatchedBird = pickBird(egg.luck);
            state.birds.unshift({
                ...hatchedBird,
                hatchedAt: new Date().toLocaleDateString(),
                eggType: egg.name
            });
            state.hatchingEgg = null;
            state.isHatching = false;
            state.hatchResult = hatchedBird;
            saveData();
            render();
        }

        function pickBird(luckMultiplier) {
            if (state.speciesList.length === 0) return { species: 'Pigeon', rarity: 'Common', color: 'gray' };
            let candidates = [];
            const attempts = Math.ceil(luckMultiplier * 2); 
            for(let i=0; i<attempts; i++) {
                const randIndex = Math.floor(Math.random() * state.speciesList.length);
                candidates.push(state.speciesList[randIndex]);
            }
            candidates.sort((a, b) => a.frequency - b.frequency);
            const winner = candidates[0];
            let rar = 'Common', col = 'gray';
            if (winner.frequency < 0.02) { rar = 'MEGA RARE'; col = 'purple'; }
            else if (winner.frequency < 0.1) { rar = 'RARE'; col = 'red'; }
            else if (winner.frequency < 0.2) { rar = 'SCARCE'; col = 'orange'; }
            else if (winner.frequency < 0.3) { rar = 'UNCOMMON'; col = 'yellow'; }
            return { species: winner.species, frequency: winner.frequency, rarity: rar, rarity_color: col };
        }

        /************************************************************
         * SCORING LOGIC
         ************************************************************/
        async function fetchFrequencyData() {
            try {
                const url = 'https://raw.githubusercontent.com/Bengician/bird-brain/main/frequency_data.json';
                const response = await fetch(url);
                const data = await response.json();
                const regionsSet = new Set();
                const uniqueSpecies = {};
                Object.keys(data).forEach(key => {
                    const parts = key.split('_');
                    if (parts.length >= 3) {
                        const region = parts.slice(2).join('_');
                        regionsSet.add(region);
                        const species = parts[0];
                        const freq = data[key].frequency;
                        if (!uniqueSpecies[species] || freq < uniqueSpecies[species]) {
                            uniqueSpecies[species] = freq;
                        }
                    }
                });
                state.speciesList = Object.keys(uniqueSpecies).map(s => ({ species: s, frequency: uniqueSpecies[s] }));
                state.frequencyData = data;
                state.regions = Array.from(regionsSet).sort();
                localStorage.setItem('frequency_data', JSON.stringify(data));
                localStorage.setItem('regions', JSON.stringify(state.regions));
            } catch (error) { console.error('Freq Error:', error); }
        }

        function weekOfYear(dateStr) {
            const date = new Date(dateStr);
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((Math.floor((date - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
        }

        function scoreObservation(species, date, count, history, freqData, region) {
            const week = weekOfYear(date);
            const key = `${species}_${week}_${region}`;
            const info = freqData[key];
            if (!info) return { species_code: species, score: 0, error: true };
            
            const base = 10 * Math.log10(1 / Math.max(info.frequency, 0.001));
            const season = info.frequency < 0.25 * info.peak_frequency ? 1.5 : 1.0;
            const prevCount = history.filter(h => h.species_code === species).length;
            let novelty = 1.0; 
            if (prevCount === 0) novelty = 4.0;
            else if (prevCount === 1) novelty = 2.0;
            
            const final = Math.round(base * season * novelty * count * 10);
            
            let rar = 'Common', col = 'gray';
            if (info.frequency < 0.02) { rar = 'MEGA RARE'; col = 'purple'; }
            else if (info.frequency < 0.1) { rar = 'RARE'; col = 'red'; }
            else if (info.frequency < 0.2) { rar = 'SCARCE'; col = 'orange'; }
            else if (info.frequency < 0.3) { rar = 'UNCOMMON'; col = 'yellow'; }
            
            return {
                species_code: species, score: final, base_score: Math.round(base * 10),
                seasonal_bonus: season, novelty_multiplier: novelty, count_multiplier: count,
                rarity: rar, rarity_color: col, frequency: info.frequency, 
                is_first: prevCount === 0, is_second: prevCount === 1
            };
        }

        let pendingFile = null;
        async function handleUpload(e) {
            pendingFile = e.target.files[0];
            if (pendingFile) { state.showRegionPrompt = true; render(); }
            e.target.value = '';
        }

        async function processChecklist(region) {
            let text = await pendingFile.text();
            text = text.replace(/^\uFEFF/, '').trim();
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });

            if (parsed.errors.length) { alert("CSV parse error"); return; }

            // 1. Calculate Score BEFORE Update (Cumulative Logic)
            const currentTotalScore = state.checklists.reduce((sum, c) => sum + c.total_score, 0);
            const previousSeeds = Math.floor(currentTotalScore / 10000);

            const results = [];
            const tempHistory = [...state.userHistory];
            let total = 0;
            let date = null;

            for (const row of parsed.data) {
                const species = row['Species'];
                const obsDate = row['Observation Date'];
                const countRaw = row['Count'];
                if (!species || !obsDate) continue;
                let count = 1;
                if (countRaw && countRaw.toUpperCase() !== 'X') {
                    const parsedCount = parseInt(countRaw, 10);
                    if (!isNaN(parsedCount)) count = parsedCount;
                }
                if (!date) date = obsDate;
                const cleanSpecies = species.trim().replace(/\s+/g, ' ');
                const cleanDate = obsDate.trim();

                const res = scoreObservation(cleanSpecies, cleanDate, count, tempHistory, state.frequencyData, region);
                results.push(res);
                total += res.score;

                if (!res.error) {
                    for (let i = 0; i < count; i++) {
                        tempHistory.push({ date: cleanDate, species_code: cleanSpecies });
                    }
                }
            }
                
            // 2. Calculate Score AFTER Update
            const newTotalScore = currentTotalScore + total;
            const newSeedsTotal = Math.floor(newTotalScore / 10000);
            
            // 3. Difference is what we award now
            const seedsEarnedNow = Math.max(0, newSeedsTotal - previousSeeds);
            state.birdseed += seedsEarnedNow;

            state.checklists = [{ 
                id: Date.now(), date, region, 
                total_score: total, species_count: results.length, observations: results,
                seed_earned: seedsEarnedNow // stored for display on card only
            }, ...state.checklists];
            
            state.userHistory = tempHistory;
            state.currentResult = state.checklists[0];
            state.showRegionPrompt = false;
            await saveData();
            render();
        }

        /************************************************************
         * UI COMPONENTS
         ************************************************************/
        function render() {
            const app = document.getElementById('app');
            // Recalculate global stats
            const totalScore = state.checklists.reduce((s, c) => s + c.total_score, 0);
            const stats = {
                obs: state.userHistory.length,
                spec: new Set(state.userHistory.map(h => h.species_code)).size,
                score: totalScore
            };

            let mainContent = '';
            if (state.loading) {
                mainContent = '<div class="text-center p-20 animate-pulse font-bold text-gray-300">SYNCING CLOUD...</div>';
            } else if (state.showUserSelect) {
                mainContent = renderUserSelect();
            } else if (state.view === 'home') {
                mainContent = renderHome(stats);
            } else if (state.view === 'history') {
                mainContent = renderHistory();
            } else if (state.view === 'nest') {
                mainContent = renderNest();
            } else if (state.view === 'collection') {
                mainContent = renderCollection();
            }

            app.innerHTML = `
                <div class="min-h-screen bg-gray-50 pb-24">
                    <div class="glass border-b p-4 sticky top-0 z-40 flex justify-between items-center shadow-sm">
                        <h1 class="text-xl font-bold tracking-tight text-gray-900">🐦 Bird Brain</h1>
                        <div class="flex items-center gap-2">
                             ${state.currentUser ? `
                                <div class="flex items-center bg-yellow-400/10 px-3 py-1 rounded-full border border-yellow-200">
                                    <span class="text-xs font-black text-yellow-600 mr-1">🟡 ${state.birdseed}</span>
                                </div>
                                <button onclick="state.showUserSelect=true;render()" class="text-sm bg-white border px-3 py-1 rounded-full font-bold shadow-sm">👤 ${state.currentUser}</button>
                             ` : ''}
                        </div>
                    </div>

                    <div class="max-w-2xl mx-auto p-4">
                        ${mainContent}
                    </div>

                    ${state.showRegionPrompt ? renderRegionPrompt() : ''}
                    ${state.showHowItWorks ? renderHowItWorks() : ''}
                    ${state.hatchResult ? renderHatchModal() : ''}

                    ${!state.showUserSelect ? `
                        <div class="fixed bottom-0 left-0 right-0 glass border-t flex justify-around p-2 pb-6 shadow-lg z-40">
                            <button onclick="state.view='home';render()" class="p-2 flex flex-col items-center ${state.view==='home'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">🏆</span><span class="text-[10px] uppercase tracking-widest mt-1">Score</span></button>
                            <button onclick="state.view='history';render()" class="p-2 flex flex-col items-center ${state.view==='history'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">📋</span><span class="text-[10px] uppercase tracking-widest mt-1">History</span></button>
                            <button onclick="state.view='nest';render()" class="p-2 flex flex-col items-center ${state.view==='nest'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">🛍️</span><span class="text-[10px] uppercase tracking-widest mt-1">Nest</span></button>
                            <button onclick="state.view='collection';render()" class="p-2 flex flex-col items-center ${state.view==='collection'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">🦅</span><span class="text-[10px] uppercase tracking-widest mt-1">Collection</span></button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderUserSelect() {
            return `
                <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md mx-auto mt-10">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-black text-2xl text-gray-900">Profiles</h2>
                        <button onclick="state.showManageUsers = !state.showManageUsers; render();" class="text-xs bg-gray-100 px-3 py-1 rounded-full font-bold uppercase tracking-tighter">
                            ${state.showManageUsers ? 'Done' : 'Edit'}
                        </button>
                    </div>
                    <div class="space-y-3 mb-8">
                        ${state.users.map(u => `<div class="flex gap-2"><button onclick="selectUser('${u}')" class="flex-1 p-5 border-2 rounded-2xl font-black text-lg hover:border-blue-500 hover:bg-blue-50 text-left transition-all">🐦 ${u}</button>${state.showManageUsers ? `<button onclick="deleteUser('${u}')" class="bg-red-50 text-red-600 border-2 border-red-100 px-4 rounded-2xl font-bold">✕</button>` : ''}</div>`).join('')}
                    </div>
                    <div class="flex gap-2 border-t pt-6">
                        <input id="newU" type="text" placeholder="Add Birding Partner" class="flex-1 border-2 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" />
                        <button onclick="createUser(document.getElementById('newU').value)" class="bg-blue-600 text-white px-6 rounded-xl font-bold shadow-lg shadow-blue-200">Add</button>
                    </div>
                </div>
            `;
        }

        function renderHome(stats) {
            return `
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-blue-600">${stats.obs}</div><div class="text-[10px] uppercase font-bold text-gray-400">Sightings</div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-green-600">${stats.spec}</div><div class="text-[10px] uppercase font-bold text-gray-400">Species</div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-yellow-500">${stats.score.toLocaleString()}</div><div class="text-[10px] uppercase font-bold text-gray-400">Total Score</div></div>
                </div>

                <div class="bg-yellow-50 border-2 border-yellow-200 p-4 rounded-3xl mb-6 flex items-center justify-between">
                    <div>
                        <div class="text-[10px] font-black text-yellow-600 uppercase tracking-widest">Banked Seed</div>
                        <div class="text-2xl font-black text-yellow-700">🟡 ${state.birdseed}</div>
                    </div>
                    <div class="text-xs text-yellow-600 font-bold max-w-[120px] text-right">Earn 1 seed for every 10k cumulative points!</div>
                </div>

                <label class="block mb-4 cursor-pointer group">
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-10 rounded-3xl text-center font-black shadow-xl group-active:scale-95 transition-all">
                        <div class="text-5xl mb-3">📤</div><div class="text-2xl">Upload eBird CSV</div>
                    </div>
                    <input type="file" accept=".csv, text/csv, application/csv, text/comma-separated-values, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" onchange="handleUpload(event)" class="hidden" />
                </label>
                <button onclick="state.showHowItWorks=true;render()" class="w-full text-gray-400 text-xs font-bold uppercase tracking-widest mb-8 hover:text-blue-500 transition-colors">How is Score Calculated?</button>
                ${state.currentResult ? renderChecklistCard(state.currentResult, true) : `<div class="text-center py-20 text-gray-300 font-bold border-4 border-dashed rounded-3xl">No data uploaded yet.</div>`}
            `;
        }

        function renderNest() {
            return `
                <div class="mb-6">
                    <h2 class="font-black text-3xl text-gray-900 mb-2">The Nest</h2>
                    <p class="text-gray-400 font-bold text-sm uppercase tracking-tighter">Exchange Birdseed for Rare Eggs</p>
                </div>

                <div class="grid grid-cols-1 gap-4 mb-10">
                    ${EGG_TYPES.map(egg => `
                        <div class="bg-white p-5 rounded-3xl border-2 shadow-sm flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="text-4xl ${egg.color} w-16 h-16 flex items-center justify-center rounded-2xl shadow-inner">${egg.emoji}</div>
                                <div>
                                    <div class="font-black text-gray-800 text-lg">${egg.name}</div>
                                    <div class="text-xs font-bold text-yellow-600">🟡 ${egg.cost} Birdseed</div>
                                </div>
                            </div>
                            <button onclick="buyEgg(${JSON.stringify(egg).replace(/"/g, '&quot;')})" 
                                class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all ${state.birdseed < egg.cost ? 'opacity-30 grayscale pointer-events-none' : ''}">
                                Buy
                            </button>
                        </div>
                    `).join('')}
                </div>
                
                <div class="text-center">
                    <button onclick="state.view='collection'; render()" class="text-sm font-bold text-blue-500">Go to your collection to hatch eggs →</button>
                </div>
            `;
        }

        function renderCollection() {
            return `
                <div class="mb-6">
                    <h2 class="font-black text-3xl text-gray-900 mb-2">Your Collection</h2>
                </div>

                <div class="mb-8 p-6 bg-gray-100 rounded-[40px] border-4 border-dashed border-gray-300 text-center relative transition-all ${state.isHatching ? 'animate-shake bg-yellow-50 border-yellow-300' : ''}"
                     ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
                    
                    ${state.isHatching ? `
                        <div class="text-6xl mb-4 animate-bounce">${state.hatchingEgg.emoji}</div>
                        <div class="font-black text-yellow-600 uppercase tracking-widest animate-pulse">Hatching...</div>
                    ` : `
                        <div class="text-4xl text-gray-300 mb-2">📥</div>
                        <div class="text-gray-400 font-bold text-sm uppercase tracking-widest">Drag Egg Here to Hatch</div>
                    `}
                </div>

                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Unhatched Eggs (${state.eggs.length})</h3>
                <div class="flex gap-4 overflow-x-auto pb-4 mb-8 snap-x">
                    ${state.eggs.map(egg => `
                        <div draggable="true" ondragstart="handleDragStart(event, '${egg.uuid}')" 
                             class="flex-shrink-0 snap-start bg-white p-4 rounded-3xl border w-32 text-center shadow-sm relative overflow-hidden group cursor-move active:scale-95 transition-transform">
                            <div class="absolute inset-0 egg-gradient pointer-events-none"></div>
                            <div class="text-4xl mb-2 select-none">${egg.emoji}</div>
                            <div class="font-black text-gray-800 text-xs truncate">${egg.name}</div>
                        </div>
                    `).join('')}
                    ${state.eggs.length === 0 ? '<div class="text-gray-400 text-xs italic p-2">No eggs yet. Visit the Nest!</div>' : ''}
                </div>

                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Trophy Room (${state.birds.length})</h3>
                <div class="grid grid-cols-2 gap-4">
                    ${state.birds.map(bird => `
                        <div class="bg-white p-4 rounded-3xl border border-${bird.rarity_color}-100 shadow-sm relative overflow-hidden">
                            <div class="text-xs font-black text-${bird.rarity_color}-600 uppercase mb-1 tracking-tighter">${bird.rarity}</div>
                            <div class="font-black text-gray-800 leading-tight mb-2">${bird.species}</div>
                            <div class="text-[10px] text-gray-400">Hatched ${bird.hatchedAt}</div>
                        </div>
                    `).join('')}
                    ${state.birds.length === 0 ? '<div class="col-span-2 py-10 border-2 border-gray-100 rounded-3xl text-center text-gray-300 font-bold">No birds hatched yet.</div>' : ''}
                </div>
            `;
        }

        function renderHatchModal() {
            const bird = state.hatchResult;
            return `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50 animate-fadeIn">
                    <div class="bg-white rounded-[40px] p-10 max-w-sm text-center shadow-2xl relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-b from-${bird.rarity_color}-50 to-white -z-10"></div>
                        <div class="text-sm font-black text-gray-400 uppercase tracking-widest mb-4">You Hatched A...</div>
                        
                        <div class="text-6xl mb-6 animate-bounce">🐦</div>
                        
                        <h2 class="font-black text-3xl text-gray-900 mb-2">${bird.species}</h2>
                        <div class="inline-block bg-${bird.rarity_color}-100 text-${bird.rarity_color}-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest mb-8 border border-${bird.rarity_color}-200">
                            ${bird.rarity}
                        </div>

                        <button onclick="state.hatchResult=null; render()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200">Keep!</button>
                    </div>
                </div>
            `;
        }

        function renderChecklistCard(c, isLatest) {
            return `
                <div class="bg-white p-6 rounded-3xl shadow-xl border relative">
                    ${c.seed_earned > 0 ? `
                        <div class="absolute -top-3 -right-3 bg-yellow-400 text-yellow-900 px-4 py-2 rounded-2xl font-black text-sm shadow-xl seed-animate border-2 border-white">
                            +${c.seed_earned} 🟡
                        </div>
                    ` : ''}
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="font-black text-xl text-gray-900">${isLatest ? 'Last Checklist' : ''}</h2>
                        <div class="text-3xl font-black text-blue-600">${c.total_score.toLocaleString()}</div>
                    </div>
                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-6">📅 ${c.date} • 📍 ${c.region}</div>
                    <div class="space-y-2">
                        ${c.observations.map((o, i) => renderObservationRow(o, i, 'home')).join('')}
                    </div>
                </div>
            `;
        }

        function renderObservationRow(o, i, viewType) {
            const uniqueId = `${viewType}_${o.species_code}_${i}`;
            const isExpanded = state.expandedSpeciesId === uniqueId;
            
            return `
                <div class="border-2 border-${o.rarity_color}-100 bg-${o.rarity_color}-50 rounded-2xl overflow-hidden transition-all">
                    <button onclick="state.expandedSpeciesId = (state.expandedSpeciesId === '${uniqueId}' ? null : '${uniqueId}'); render()" class="w-full p-4 flex justify-between items-center">
                        <div class="text-left">
                            <div class="font-black text-gray-800 text-lg flex items-center gap-2">
                                ${o.species_code} 
                                <span class="text-[10px] bg-${o.rarity_color}-600 text-white px-2 py-0.5 rounded-full uppercase font-bold tracking-tighter">${o.rarity}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-0.5">
                                ${o.is_first ? '<span class="text-[10px] font-black text-green-600 uppercase">Life Bird! (4x Bonus)</span>' : (o.is_second ? '<span class="text-[10px] font-black text-blue-500 uppercase">2nd Sighting (2x Bonus)</span>' : '')}
                                ${o.count_multiplier > 1 ? `<span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded-md font-black border border-green-200 uppercase">x${o.count_multiplier}</span>` : ''}
                            </div>
                        </div>
                        <div class="font-black text-xl text-blue-800">${o.score.toLocaleString()}</div>
                    </button>
                    ${isExpanded ? `
                        <div class="p-4 border-t bg-white text-[11px] space-y-2 text-gray-600 animate-fadeIn">
                            <div class="flex justify-between"><span>Base Score</span><span class="font-bold text-blue-600">${o.base_score}</span></div>
                            <div class="flex justify-between"><span>Seasonal Multiplier</span><span class="font-bold text-orange-500">×${o.seasonal_bonus}</span></div>
                            <div class="flex justify-between"><span>Novelty Multiplier</span><span class="font-bold text-purple-600">×${o.novelty_multiplier}</span></div>
                            <div class="flex justify-between text-gray-800"><span>Observation Multiplier</span><span class="font-bold text-green-600">×${o.count_multiplier}</span></div>
                            <div class="flex justify-between font-black border-t pt-2 text-gray-900 text-sm"><span>Final Points</span><span>${o.score.toLocaleString()}</span></div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderHistory() {
            return `
                <div class="flex justify-between items-end mb-6">
                    <h2 class="font-black text-3xl text-gray-900">History</h2>
                    <button onclick="if(confirm('Wipe History?')) { state.checklists=[]; state.userHistory=[]; state.currentResult=null; state.birdseed=0; state.eggs=[]; state.birds=[]; saveData(); render(); }" class="text-[10px] font-black text-red-400 uppercase tracking-widest">Clear All</button>
                </div>
                <div class="space-y-4">
                    ${state.checklists.map(c => `
                        <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                            <button onclick="state.expandedChecklistId = (state.expandedChecklistId === ${c.id} ? null : ${c.id}); render();" class="w-full p-5 flex justify-between items-center hover:bg-gray-50 transition-colors">
                                <div class="text-left"><div class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">${c.date}</div><div class="font-black text-gray-800">${c.region}</div></div>
                                <div class="flex items-center gap-3">
                                    ${c.seed_earned ? `<span class="text-xs font-black text-yellow-500">🟡 +${c.seed_earned}</span>` : ''}
                                    <div class="text-2xl font-black text-blue-600">${c.total_score.toLocaleString()}</div>
                                    <span class="text-gray-300 font-bold">${state.expandedChecklistId === c.id ? '▲' : '▼'}</span>
                                </div>
                            </button>
                            ${state.expandedChecklistId === c.id ? `
                                <div class="bg-gray-50 border-t p-4 space-y-3 animate-fadeIn">
                                    ${c.observations.map((o, idx) => renderObservationRow(o, idx, 'history_' + c.id)).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                    ${state.checklists.length === 0 ? '<div class="text-center py-20 text-gray-300 font-bold">No history available.</div>' : ''}
                </div>
            `;
        }

        function renderRegionPrompt() {
            return `
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
                    <div class="bg-white rounded-3xl p-8 w-full max-w-sm max-h-[70vh] overflow-y-auto shadow-2xl">
                        <h2 class="font-black text-2xl mb-2 text-gray-900">Location</h2>
                        <p class="text-gray-400 text-sm mb-6">Frequencies vary by region.</p>
                        <div class="space-y-1">
                            ${state.regions.map(r => `<button onclick="processChecklist('${r}')" class="w-full text-left p-4 border-b hover:bg-blue-50 font-bold text-gray-800 transition-colors flex justify-between"><span>${r}</span><span class="text-blue-500">→</span></button>`).join('')}
                        </div>
                        <button onclick="state.showRegionPrompt=false; render();" class="w-full mt-6 text-gray-400 font-black uppercase text-xs tracking-widest">Back</button>
                    </div>
                </div>
            `;
        }

        function renderHowItWorks() {
            return `
                <div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 z-50">
                    <div class="bg-white rounded-[40px] p-8 max-w-md shadow-2xl relative">
                        <h2 class="font-black text-2xl mb-4 text-gray-900">How Scoring Works</h2>
                        
                        <div class="space-y-6">
                            <div class="flex gap-4">
                                <div class="text-3xl bg-blue-50 w-14 h-14 rounded-2xl flex items-center justify-center">📉</div>
                                <div>
                                    <h4 class="font-black text-gray-900">Rarity Score</h4>
                                    <p class="text-[11px] text-gray-500 font-bold leading-relaxed">Points are based on local frequency data. Rarer birds = More points.</p>
                                </div>
                            </div>

                            <div class="flex gap-4">
                                <div class="text-3xl bg-yellow-50 w-14 h-14 rounded-2xl flex items-center justify-center">🟡</div>
                                <div>
                                    <h4 class="font-black text-gray-900">Birdseed</h4>
                                    <p class="text-[11px] text-gray-500 font-bold leading-relaxed">Earn <span class="text-yellow-600">1 Birdseed for every 10,000 points</span> (Cumulative!). Use seed to buy eggs!</p>
                                </div>
                            </div>

                            <div class="flex gap-4">
                                <div class="text-3xl bg-purple-50 w-14 h-14 rounded-2xl flex items-center justify-center">✨</div>
                                <div><h4 class="font-black text-gray-900">Novelty Bonuses</h4>
                                    <ul class="text-[11px] text-gray-500 space-y-1 mt-1 font-bold">
                                        <li>✨ <span class="text-green-600 uppercase">Life Bird:</span> 4x bonus</li>
                                        <li>🐦 <span class="text-blue-500 uppercase">2nd Sighting:</span> 2x bonus</li>
                                        <li>🔄 <span class="text-gray-600 uppercase">Repeats:</span> 1x</li>
                                    </ul>
                                </div>
                            </div>
                            <div class="flex gap-4">
                                <div class="text-3xl bg-green-50 w-14 h-14 rounded-2xl flex items-center justify-center">🔢</div>
                                <div><h4 class="font-black text-gray-900">Observation Multiplier</h4><p class="text-sm text-gray-500 leading-relaxed">Every bird counts! Independent observations of a species are each counted towards your final score.</p></div>
                            </div>
                        </div>

                        <button onclick="state.showHowItWorks=false;render()" class="w-full bg-gray-900 text-white mt-10 py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-blue-600 transition-all">Got it</button>
                    </div>
                </div>
            `;
        }

        loadData();
    </script>
</body>
</html>
