        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }

            100% { transform: translate(1px, -2px) rotate(-1deg); }

        /************************************************************
         * USER & CLOUD LOGIC
         ************************************************************/
        async function loadData() {
            state.loading = true;
            render();
            try {
                const { data: profiles } = await db.from('profiles').select('username');
                if (profiles) state.users = profiles.map(p => p.username);

                await fetchFrequencyData();

                const savedUser = localStorage.getItem('current_user');
                if (savedUser && state.users.includes(savedUser)) {
                    await selectUser(savedUser);
                } else {
                    state.showUserSelect = true;
                }
            } catch (error) { console.error('Initial load error:', error); }

        }

        async function selectUser(username) {
            state.loading = true;
            render();
            state.currentUser = username;
            localStorage.setItem('current_user', username);
            try {
                const { data } = await db.from('checklist_data').select('data, history').eq('username', username).maybeSingle();
                const rawData = data?.data;
                state.userHistory = data?.history || [];

                if (rawData && typeof rawData === 'object' && !Array.isArray(rawData)) {
                    state.checklists = rawData.checklists || [];
                    state.birdseed = rawData.birdseed || 0;
                    state.eggs = rawData.eggs || [];
                    state.birds = rawData.birds || [];
                } else {
                    state.checklists = [];
                    state.birdseed = 0;
                    state.eggs = [];
                    state.birds = [];
                }

                if (state.checklists.length > 0) {
                    state.currentResult = state.checklists[0];
                    state.lastRegion = state.checklists[0].region;
                }
            } catch (error) { console.error("Load error:", error); }
            state.showUserSelect = false;
            state.showManageUsers = false;
            state.loading = false;
            render();

        async function createUser(username) {
            if (!username || username.trim() === '') return alert('Enter a username');
            const { error } = await db.from('profiles').insert([{ username: username.trim() }]);
            if (error) return alert('User exists or DB error');
            state.users.push(username.trim());
            await selectUser(username.trim());
        }

        async function deleteUser(username) {
            if (!confirm(`Delete ${username}?`)) return;
            await db.from('checklist_data').delete().eq('username', username);
            await db.from('profiles').delete().eq('username', username);
            state.users = state.users.filter(u => u !== username);
            if (state.currentUser === username) {
                state.currentUser = null;
                state.showUserSelect = true;
            }
            render();
        }

        async function saveData() {
            if (!state.currentUser) return;
            const packedData = {
                checklists: state.checklists,
                birdseed: state.birdseed,
                eggs: state.eggs,
                birds: state.birds
            };
            await db.from('checklist_data').upsert({
                username: state.currentUser,
                data: packedData, 
                history: state.userHistory,
                updated_at: new Date().toISOString()
            }, { onConflict: 'username' });
        }

        /************************************************************
         * HATCHING LOGIC
         ************************************************************/
        function buyEgg(eggType) {
            if (state.birdseed >= eggType.cost) {
                state.birdseed -= eggType.cost;
                state.eggs.push({ ...eggType, uuid: Date.now() + Math.random().toString() });
                saveData();
                render();
            } else alert("Not enough birdseed!");
        }

        async function handleDrop(e) {
            e.preventDefault();
            if (state.isHatching) return;
            const eggUuid = e.dataTransfer.getData("text/plain");
            const eggIndex = state.eggs.findIndex(egg => egg.uuid === eggUuid);
            if (eggIndex > -1) {
                const egg = state.eggs[eggIndex];
                state.eggs.splice(eggIndex, 1);
                state.hatchingEgg = egg;
                state.isHatching = true;
                render();
                setTimeout(() => { finalizeHatch(egg); }, 2000);
            }
        }

        function finalizeHatch(egg) {
            const hatchedBird = pickBird(egg.luck);
            state.birds.unshift({ ...hatchedBird, hatchedAt: new Date().toLocaleDateString() });
            state.hatchingEgg = null;
            state.isHatching = false;
            state.hatchResult = hatchedBird;
            saveData();
            render();
        }

        function pickBird(luckMultiplier) {
            let targetRegion = state.lastRegion || Object.keys(state.regionSpeciesMap)[0];
            const speciesPool = state.regionSpeciesMap[targetRegion];

            const rollTier = () => {
                const rand = Math.random();
                let cumulative = 0;
                for (const tier of RARITY_TIERS) {
                    cumulative += tier.chance;
                    if (rand <= cumulative) return tier;
                }
                return RARITY_TIERS[4];
            };

            let bestTier = rollTier();
            const tierOrder = RARITY_TIERS.map(t => t.id);
            for (let i = 1; i < luckMultiplier; i++) {
                const newTier = rollTier();
                if (tierOrder.indexOf(newTier.id) < tierOrder.indexOf(bestTier.id)) bestTier = newTier;
            }

            let birdsInTier = speciesPool.filter(b => b.peak_frequency >= bestTier.min && b.peak_frequency < bestTier.max);
            
            // Fallback logic for empty tiers
            if (birdsInTier.length === 0) {
                 const currentIdx = RARITY_TIERS.indexOf(bestTier);
                 const fallbackTier = RARITY_TIERS[Math.min(currentIdx + 1, RARITY_TIERS.length - 1)];
                 const fallbackPool = speciesPool.filter(b => b.peak_frequency >= fallbackTier.min && b.peak_frequency < fallbackTier.max);
                 
                 if (fallbackPool.length === 0) {
                     const randomFallback = speciesPool[Math.floor(Math.random() * speciesPool.length)];
                     const randomTier = RARITY_TIERS.find(t => randomFallback.peak_frequency >= t.min && randomFallback.peak_frequency < t.max) || RARITY_TIERS[4];
                     return { species: randomFallback.species, rarity: randomTier.id, rarity_color: randomTier.color, region: targetRegion };
                 }
                 bestTier = fallbackTier;
                 birdsInTier.push(...fallbackPool);
            }

            const totalWeight = birdsInTier.reduce((sum, b) => sum + b.peak_frequency, 0);
            let birdRand = Math.random() * totalWeight;
            let winner = birdsInTier[0];
            for (const bird of birdsInTier) {
                birdRand -= bird.peak_frequency;
                if (birdRand <= 0) { winner = bird; break; }
            }

            return { species: winner.species, rarity: bestTier.id, rarity_color: bestTier.color, region: targetRegion };
        }

        /************************************************************
         * DATA PROCESSING (SCORING)
         ************************************************************/
        async function fetchFrequencyData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Bengician/bird-brain/main/frequency_data.json');
                const data = await response.json();
                const regionMap = {};
                Object.keys(data).forEach(key => {
                    const parts = key.split('_');
                    if (parts.length >= 3) {
                        const region = parts.slice(2).join('_');
                        const species = parts[0];
                        const info = data[key];
                        if (!regionMap[region]) regionMap[region] = [];
                        let existing = regionMap[region].find(b => b.species === species);
                        let currentVal = info.peak_frequency || info.frequency;
                        if (!existing) regionMap[region].push({ species, peak_frequency: currentVal });
                        else if (currentVal > existing.peak_frequency) existing.peak_frequency = currentVal;
                    }
                });
                state.frequencyData = data;
                state.regionSpeciesMap = regionMap; 
                state.regions = Object.keys(regionMap).sort();
            } catch (error) { console.error('Freq Error:', error); }
        }

        function weekOfYear(dateStr) {
            const date = new Date(dateStr);
            const startOfYear = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((Math.floor((date - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
        }

        function scoreObservation(species, date, count, history, freqData, region) {
            const week = weekOfYear(date);
            const info = freqData[`${species}_${week}_${region}`];
            if (!info) return { species_code: species, score: 0, error: true };
            
            const base = 10 * Math.log10(1 / Math.max(info.frequency, 0.001));
            const season = info.frequency < 0.25 * info.peak_frequency ? 1.5 : 1.0;
            const prevCount = history.filter(h => h.species_code === species).length;
            const novelty = prevCount === 0 ? 4.0 : (prevCount === 1 ? 2.0 : 1.0);
            const final = Math.round(base * season * novelty * count * 10);
            
            const tier = RARITY_TIERS.find(t => info.peak_frequency >= t.min && info.peak_frequency < t.max) || RARITY_TIERS[4];
            
            return {
                species_code: species, score: final, base_score: Math.round(base * 10),
                seasonal_bonus: season, novelty_multiplier: novelty, count_multiplier: count,
                rarity: tier.id, rarity_color: tier.color, frequency: info.frequency, 
                is_first: prevCount === 0, is_second: prevCount === 1
            };
        }

        // --- SHARED SCORING ENGINE ---
        // This function now accepts raw data array: [{ species: 'Name', count: 1, date: 'YYYY-MM-DD' }, ...]
        async function executeScoring(rawData, region) {
            const currentTotalScore = state.checklists.reduce((sum, c) => sum + c.total_score, 0);
            const previousSeeds = Math.floor(currentTotalScore / 10000);

            const results = [];
            const tempHistory = [...state.userHistory];
            let total = 0;
            let date = rawData[0]?.date || new Date().toISOString().split('T')[0];

            for (const item of rawData) {
                const cleanSpecies = item.species.trim().replace(/\s+/g, ' ');
                const res = scoreObservation(cleanSpecies, item.date, item.count, tempHistory, state.frequencyData, region);
                results.push(res);
                total += res.score;
                if (!res.error) { 
                    for (let i = 0; i < item.count; i++) tempHistory.push({ date: item.date, species_code: cleanSpecies }); 
                }
            }
                
            const seedsEarnedNow = Math.max(0, Math.floor((currentTotalScore + total) / 10000) - previousSeeds);
            state.birdseed += seedsEarnedNow;
            state.checklists = [{ id: Date.now(), date, region, total_score: total, species_count: results.length, observations: results, seed_earned: seedsEarnedNow }, ...state.checklists];
            state.lastRegion = region;
            state.userHistory = tempHistory;
            state.currentResult = state.checklists[0];
            
            await saveData();
            state.showRegionPrompt = false;
            state.showImportModal = false;
            render();
        }

        // --- CSV HANDLING ---
        let pendingFile = null;
        async function handleUpload(e) {
            pendingFile = e.target.files[0];
            if (pendingFile) { state.showRegionPrompt = true; render(); }
            e.target.value = '';
        }

        async function processCSV(region) {
            let text = await pendingFile.text();
            text = text.replace(/^\uFEFF/, '').trim();
            const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
            
            const standardizedData = [];
            for (const row of parsed.data) {
                const species = row['Species'];
                const obsDate = row['Observation Date'];
                const countRaw = row['Count'];
                if (!species || !obsDate) continue;
                let count = (countRaw && countRaw.toUpperCase() !== 'X') ? parseInt(countRaw, 10) : 1;
                
                standardizedData.push({
                    species: species,
                    date: obsDate.trim(),
                    count: isNaN(count) ? 1 : count
                });
            }
            executeScoring(standardizedData, region);
        }

        /************************************************************
         * EBIRD API & SCRAPER
         ************************************************************/
        async function findChecklists() {
            if (!state.ebirdToken) return alert("Please enter an eBird API Token.");
            localStorage.setItem('ebird_token', state.ebirdToken);
            state.isFetchingChecklists = true;
            render();

            try {
                // 1. Define the eBird API URL
                const ebirdUrl = `https://api.ebird.org/v2/product/checklist/feed/${state.importRegion}/${state.importDate.replace(/-/g, '/')}?maxResults=200`;
                
                // 2. Wrap it in the CORS Proxy URL
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(ebirdUrl)}`;

                // 3. Fetch from the Proxy instead of directly from eBird
                const res = await fetch(proxyUrl, { 
                    headers: { 'X-eBirdApiToken': state.ebirdToken } 
                });

                if (!res.ok) throw new Error("API Error");
                const list = await res.json();
                
                // 4. Filter by the current Bird Brain username
                state.foundChecklists = list.filter(c => c.userDisplayName === state.currentUser);
                
                if (state.foundChecklists.length === 0) {
                    alert(`No checklists found for "${state.currentUser}" in ${state.importRegion} on ${state.importDate}. Make sure your eBird "Display Name" matches your Bird Brain profile name exactly.`);
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Failed to fetch. This is usually due to an invalid Region Code or API Key.");
            } finally {
                state.isFetchingChecklists = false;
                render();
            }
        }

        async function scrapeAndScore(checklist) {
            state.loading = true;
            render();
            try {
                // Use a proxy to bypass CORS restrictions
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(`https://ebird.org/checklist/${checklist.subId}`)}`;
                const response = await fetch(proxyUrl);
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const obsData = [];
                // eBird Web Page Parsing (Subject to structure changes)
                // Select all observation list items
                const listItems = doc.querySelectorAll('li[data-species-code]');
                
                listItems.forEach(li => {
                    const speciesEl = li.querySelector('.Heading-main');
                    const countEl = li.querySelector('.Observation-number span span:last-child') || li.querySelector('.Observation-number');
                    
                    if (speciesEl) {
                        let name = speciesEl.innerText.trim();
                        // Remove "sp." or brackets if necessary, but Frequency map usually handles full names
                        let count = 1;
                        if (countEl) {
                            const txt = countEl.innerText.trim();
                            count = txt.toUpperCase() === 'X' ? 1 : parseInt(txt.replace(/,/g, '')) || 1;
                        }
                        // Clean name (remove age/sex details often in parens if simplest approach fails, but let's try raw first)
                        name = name.split('(')[0].trim();
                        
                        obsData.push({
                            species: name,
                            count: count,
                            date: state.importDate
                        });
                    }
                });

                if (obsData.length === 0) throw new Error("Could not parse species.");
                
                // Map region name from API to something general or just use prompt? 
                // For simplicity, we use the Import Region logic or prompt logic. 
                // But we know the region code. Let's try to map region code to our known regions if possible,
                // or just ask the user to confirm the scoring region (safest).
                // Actually, let's use the UI Prompt to Map it to a supported region for scoring accuracy.
                
                state.tempScrapedData = obsData;
                state.showImportModal = false;
                state.showRegionPrompt = true; // Use existing prompt to select "Santa Barbara" etc.
                state.loading = false;
                render();

            } catch (err) {
                console.error(err);
                alert("Error scraping checklist. Ensure it is visible to public.");
                state.loading = false;
                render();
            }
        }

        /************************************************************

                        <div class="flex items-center gap-2">

                                    <span class="text-xs font-black text-yellow-600 mr-1">🟡 ${state.birdseed}</span>
                                </div>
                                <button onclick="state.showUserSelect=true;render()" class="text-sm bg-white border px-3 py-1 rounded-full font-bold shadow-sm">👤 ${state.currentUser}</button>
                             ` : ''}
                        </div>
                    </div>
                    <div class="max-w-2xl mx-auto p-4">${mainContent}</div>
                    ${state.showRegionPrompt ? renderRegionPrompt() : ''}
                    ${state.showImportModal ? renderImportModal() : ''}
                    ${state.showHowItWorks ? renderHowItWorks() : ''}
                    ${state.hatchResult ? renderHatchModal() : ''}
                    ${!state.showUserSelect ? `
                        <div class="fixed bottom-0 left-0 right-0 glass border-t flex justify-around p-2 pb-6 shadow-lg z-40">
                            <button onclick="state.view='home';render()" class="p-2 flex flex-col items-center ${state.view==='home'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">🏆</span><span class="text-[10px] uppercase mt-1">Score</span></button>
                            <button onclick="state.view='history';render()" class="p-2 flex flex-col items-center ${state.view==='history'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">📋</span><span class="text-[10px] uppercase mt-1">History</span></button>
                            <button onclick="state.view='nest';render()" class="p-2 flex flex-col items-center ${state.view==='nest'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">🛍️</span><span class="text-[10px] uppercase mt-1">Nest</span></button>
                            <button onclick="state.view='collection';render()" class="p-2 flex flex-col items-center ${state.view==='collection'?'text-blue-600 font-bold':'text-gray-600'}"><span class="text-xl">🦅</span><span class="text-[10px] uppercase mt-1">Birds</span></button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderUserSelect() {
            return `<div class="bg-white p-8 rounded-3xl shadow-xl max-w-md mx-auto mt-10">
                <div class="flex justify-between items-center mb-6"><h2 class="font-black text-2xl text-gray-900">Profiles</h2><button onclick="state.showManageUsers = !state.showManageUsers; render();" class="text-xs bg-gray-100 px-3 py-1 rounded-full font-bold uppercase tracking-tighter">${state.showManageUsers ? 'Done' : 'Edit'}</button></div>
                <div class="space-y-3 mb-8">${state.users.map(u => `<div class="flex gap-2"><button onclick="selectUser('${u}')" class="flex-1 p-5 border-2 rounded-2xl font-black text-lg hover:border-blue-500 hover:bg-blue-50 text-left transition-all">🐦 ${u}</button>${state.showManageUsers ? `<button onclick="deleteUser('${u}')" class="bg-red-50 text-red-600 border-2 border-red-100 px-4 rounded-2xl font-bold">✕</button>` : ''}</div>`).join('')}</div>
                <div class="flex gap-2 border-t pt-6"><input id="newU" type="text" placeholder="Add Birding Partner" class="flex-1 border-2 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" /><button onclick="createUser(document.getElementById('newU').value)" class="bg-blue-600 text-white px-6 rounded-xl font-bold shadow-lg shadow-blue-200">Add</button></div>

            return `
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-blue-600">${stats.obs}</div><div class="text-[10px] uppercase font-bold text-gray-400">Sightings</div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-green-600">${stats.spec}</div><div class="text-[10px] uppercase font-bold text-gray-400">Species</div></div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border text-center"><div class="text-2xl font-black text-yellow-500">${stats.score.toLocaleString()}</div><div class="text-[10px] uppercase font-bold text-gray-400">Total Score</div></div>
                </div>
                <div class="bg-yellow-50 border-2 border-yellow-200 p-4 rounded-3xl mb-6 flex items-center justify-between">
                    <div><div class="text-[10px] font-black text-yellow-600 uppercase tracking-widest">Banked Seed</div><div class="text-2xl font-black text-yellow-700">🟡 ${state.birdseed}</div></div>
                    <div class="text-xs text-yellow-600 font-bold max-w-[120px] text-right">Earn 1 seed for every 10k cumulative points!</div>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <label class="cursor-pointer group">
                        <div class="bg-white border-2 border-dashed border-gray-300 p-6 rounded-3xl text-center hover:border-blue-500 hover:bg-blue-50 transition-all">
                            <div class="text-3xl mb-2">📁</div>
                            <div class="font-bold text-sm text-gray-600">Upload CSV</div>
                        </div>
                        <input type="file" onchange="handleUpload(event)" class="hidden" />
                    </label>
                    <button onclick="state.showImportModal=true; render()" class="bg-white border-2 border-dashed border-gray-300 p-6 rounded-3xl text-center hover:border-green-500 hover:bg-green-50 transition-all group">
                        <div class="text-3xl mb-2">☁️</div>
                        <div class="font-bold text-sm text-gray-600">eBird Import</div>
                    </button>
                </div>

                <button onclick="state.showHowItWorks=true;render()" class="w-full text-gray-400 text-xs font-bold uppercase tracking-widest mb-8 hover:text-blue-500 transition-colors">How is Score Calculated?</button>
                ${state.currentResult ? renderChecklistCard(state.currentResult, true) : `<div class="text-center py-20 text-gray-300 font-bold border-4 border-dashed rounded-3xl">No data uploaded yet.</div>`}
            `;
        }

        function renderImportModal() {
            return `
            <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50">
                <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl overflow-y-auto max-h-[85vh]">
                    <div class="flex justify-between items-center mb-6"><h2 class="font-black text-2xl text-gray-900">Import Checklist</h2><button onclick="state.showImportModal=false;render()" class="text-gray-400 text-2xl">×</button></div>
                    
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">eBird API Key</label>
                            <input type="password" value="${state.ebirdToken}" onchange="state.ebirdToken=this.value" placeholder="Enter API Token" class="w-full border-2 p-3 rounded-xl font-bold bg-gray-50 outline-none focus:border-green-500">
                            <a href="https://ebird.org/api/keygen" target="_blank" class="text-[10px] text-blue-500 font-bold underline">Get Free Key</a>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Region Code</label>
                                <input type="text" value="${state.importRegion}" onchange="state.importRegion=this.value" class="w-full border-2 p-3 rounded-xl font-bold bg-gray-50 outline-none focus:border-green-50">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Date</label>
                                <input type="date" value="${state.importDate}" onchange="state.importDate=this.value" class="w-full border-2 p-3 rounded-xl font-bold bg-gray-50 outline-none focus:border-green-50">
                            </div>
                        </div>
                        <button onclick="findChecklists()" class="w-full bg-green-600 text-white py-3 rounded-xl font-black shadow-lg shadow-green-200">
                            ${state.isFetchingChecklists ? 'Searching...' : 'Find My Checklists'}
                        </button>
                    </div>

                    ${state.foundChecklists.length > 0 ? `
                        <div class="border-t pt-4">
                            <h3 class="text-xs font-bold text-gray-400 uppercase mb-3">Results for ${state.currentUser}</h3>
                            <div class="space-y-2">
                                ${state.foundChecklists.map(c => `
                                    <button onclick="scrapeAndScore({subId: '${c.subId}'})" class="w-full text-left p-4 bg-gray-50 hover:bg-green-50 border rounded-xl transition-all group">
                                        <div class="flex justify-between items-center mb-1">
                                            <span class="font-black text-gray-800">${c.obsTime}</span>
                                            <span class="text-[10px] bg-white border px-2 py-1 rounded-md font-bold text-gray-500 group-hover:border-green-200 group-hover:text-green-600">${c.subId}</span>
                                        </div>
                                        <div class="text-xs font-bold text-gray-500 truncate">${c.locName}</div>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    ` : '<div class="text-center text-gray-400 text-xs py-4">No checklists loaded.</div>'}
                </div>
            </div>`;
        }

        function renderNest() {
            return `
                <div class="mb-6"><h2 class="font-black text-3xl text-gray-900 mb-2">The Nest</h2><p class="text-gray-400 font-bold text-sm uppercase tracking-tighter">Exchange Birdseed for Rare Eggs</p></div>
                <div class="grid grid-cols-1 gap-4 mb-10">
                    ${EGG_TYPES.map(egg => `
                        <div class="bg-white p-5 rounded-3xl border-2 shadow-sm flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="text-4xl ${egg.color} w-16 h-16 flex items-center justify-center rounded-2xl shadow-inner">${egg.emoji}</div>
                                <div><div class="font-black text-gray-800 text-lg">${egg.name}</div><div class="text-xs font-bold text-yellow-600">🟡 ${egg.cost} Birdseed</div></div>
                            </div>
                            <button onclick="buyEgg(${JSON.stringify(egg).replace(/"/g, '&quot;')})" 
                                class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all ${state.birdseed < egg.cost ? 'opacity-30 grayscale pointer-events-none' : ''}">Buy</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCollection() {
            return `
                <div class="mb-6"><h2 class="font-black text-3xl text-gray-900">Your Collection</h2></div>
                <div class="mb-8 p-6 bg-gray-100 rounded-[40px] border-4 border-dashed border-gray-300 text-center relative transition-all ${state.isHatching ? 'animate-shake bg-yellow-50 border-yellow-300' : ''}"
                     ondragover="event.preventDefault()" ondrop="handleDrop(event)">
                    ${state.isHatching ? `<div class="text-6xl mb-4 animate-bounce">${state.hatchingEgg.emoji}</div><div class="font-black text-yellow-600 uppercase tracking-widest animate-pulse">Hatching...</div>` : `<div class="text-4xl text-gray-300 mb-2">📥</div><div class="text-gray-400 font-bold text-sm uppercase tracking-widest">Drag Egg Here to Hatch</div>`}
                </div>
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Unhatched Eggs (${state.eggs.length})</h3>
                <div class="flex gap-4 overflow-x-auto pb-4 mb-8 snap-x">
                    ${state.eggs.map(egg => `<div draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '${egg.uuid}')" class="flex-shrink-0 snap-start bg-white p-4 rounded-3xl border w-32 text-center shadow-sm relative cursor-move active:scale-95 transition-transform"><div class="text-4xl mb-2 select-none">${egg.emoji}</div><div class="font-black text-gray-800 text-xs truncate">${egg.name}</div></div>`).join('')}
                </div>
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Trophy Room (${state.birds.length})</h3>
                <div class="grid grid-cols-2 gap-4">
                    ${state.birds.map(bird => `<div class="bg-white p-4 rounded-3xl border border-${bird.rarity_color}-100 shadow-sm relative overflow-hidden"><div class="text-xs font-black text-${bird.rarity_color}-600 uppercase mb-1 tracking-tighter">${bird.rarity}</div><div class="font-black text-gray-800 leading-tight mb-2">${bird.species}</div><div class="text-[10px] text-gray-400">From ${bird.region}</div></div>`).join('')}
                </div>
            `;
        }

        function renderHatchModal() {
            const bird = state.hatchResult;
            return `<div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50 animate-fadeIn"><div class="bg-white rounded-[40px] p-10 max-w-sm text-center shadow-2xl relative overflow-hidden"><div class="absolute inset-0 bg-gradient-to-b from-${bird.rarity_color}-50 to-white -z-10"></div><div class="text-sm font-black text-gray-400 uppercase tracking-widest mb-4">You Hatched A...</div><div class="text-6xl mb-6 animate-bounce">🐦</div><h2 class="font-black text-3xl text-gray-900 mb-2">${bird.species}</h2><div class="inline-block bg-${bird.rarity_color}-100 text-${bird.rarity_color}-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest mb-2 border border-${bird.rarity_color}-200">${bird.rarity}</div><div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-6">Region: ${bird.region}</div><button onclick="state.hatchResult=null; render()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200">Keep!</button></div></div>`;
        }

        function renderChecklistCard(c, isLatest) {
            return `<div class="bg-white p-6 rounded-3xl shadow-xl border relative">${c.seed_earned > 0 ? `<div class="absolute -top-3 -right-3 bg-yellow-400 text-yellow-900 px-4 py-2 rounded-2xl font-black text-sm shadow-xl seed-animate border-2 border-white">+${c.seed_earned} 🟡</div>` : ''}
                <div class="flex justify-between items-center mb-1"><h2 class="font-black text-xl text-gray-900">${isLatest ? 'Last Checklist' : ''}</h2><div class="text-3xl font-black text-blue-600">${c.total_score.toLocaleString()}</div></div>
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-6">📅 ${c.date} • 📍 ${c.region}</div>
                <div class="space-y-2">${c.observations.map((o, i) => renderObservationRow(o, i, 'home')).join('')}</div></div>`;
        }

        function renderObservationRow(o, i, viewType) {
            const uniqueId = `${viewType}_${o.species_code}_${i}`, isExpanded = state.expandedSpeciesId === uniqueId;
            return `<div class="border-2 border-${o.rarity_color}-100 bg-${o.rarity_color}-50 rounded-2xl overflow-hidden mb-2 transition-all">
                <button onclick="state.expandedSpeciesId = (state.expandedSpeciesId === '${uniqueId}' ? null : '${uniqueId}'); render()" class="w-full p-4 flex justify-between items-center">
                    <div class="text-left"><div class="font-black text-gray-800 text-lg flex items-center gap-2">${o.species_code} <span class="text-[10px] bg-${o.rarity_color}-600 text-white px-2 py-0.5 rounded-full uppercase font-bold tracking-tighter">${o.rarity}</span></div>
                    <div class="flex items-center gap-2 mt-0.5">${o.is_first ? '<span class="text-[10px] font-black text-green-600 uppercase tracking-tighter">Life Bird! (4x Bonus)</span>' : (o.is_second ? '<span class="text-[10px] font-black text-blue-500 uppercase tracking-tighter">2nd Sighting (2x Bonus)</span>' : '')}
                    ${o.count_multiplier > 1 ? `<span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded-md font-black border border-green-200 uppercase tracking-tighter">x${o.count_multiplier}</span>` : ''}</div></div>
                    <div class="font-black text-xl text-blue-800">${o.score.toLocaleString()}</div>
                </button>
                ${isExpanded ? `<div class="p-4 border-t bg-white text-[11px] space-y-2 text-gray-600 animate-fadeIn">
                    <div class="flex justify-between"><span>Base Score (F: ${(o.frequency*100).toFixed(2)}%)</span><span class="font-bold text-blue-600">${o.base_score}</span></div>
                    <div class="flex justify-between"><span>Seasonal Multiplier</span><span class="font-bold text-orange-500">×${o.seasonal_bonus}</span></div>
                    <div class="flex justify-between"><span>Novelty Multiplier</span><span class="font-bold text-purple-600">×${o.novelty_multiplier}</span></div>
                    <div class="flex justify-between text-gray-800"><span>Observation Multiplier</span><span class="font-bold text-green-600">×${o.count_multiplier}</span></div>
                    <div class="flex justify-between font-black border-t pt-2 text-gray-900 text-sm"><span>Final Points</span><span>${o.score.toLocaleString()}</span></div>
                </div>` : ''}</div>`;
        }

        function renderHistory() {
            return `<div class="flex justify-between items-end mb-6"><h2 class="font-black text-3xl text-gray-900">History</h2><button onclick="if(confirm('Wipe History?')) { state.checklists=[]; state.userHistory=[]; state.birdseed=0; state.eggs=[]; state.birds=[]; saveData(); render(); }" class="text-[10px] font-black text-red-400 uppercase tracking-widest">Clear All</button></div>
                <div class="space-y-4">${state.checklists.map(c => `<div class="bg-white rounded-3xl shadow-sm border overflow-hidden"><button onclick="state.expandedChecklistId = (state.expandedChecklistId === ${c.id} ? null : ${c.id}); render();" class="w-full p-5 flex justify-between items-center hover:bg-gray-50 transition-colors"><div class="text-left"><div class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">${c.date}</div><div class="font-black text-gray-800">${c.region}</div></div><div class="flex items-center gap-3">${c.seed_earned ? `<span class="text-xs font-black text-yellow-500">🟡 +${c.seed_earned}</span>` : ''}<div class="text-2xl font-black text-blue-600">${c.total_score.toLocaleString()}</div><span class="text-gray-300 font-bold">${state.expandedChecklistId === c.id ? '▲' : '▼'}</span></div></button>${state.expandedChecklistId === c.id ? `<div class="bg-gray-50 border-t p-4 space-y-3 animate-fadeIn">${c.observations.map((o, idx) => renderObservationRow(o, idx, 'history_' + c.id)).join('')}</div>` : ''}</div>`).join('')}</div>`;
        }

        function renderRegionPrompt() {
            // Updated region prompt to accept Temp Data from Scraper
            return `<div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-6 z-50"><div class="bg-white rounded-3xl p-8 w-full max-w-sm max-h-[70vh] overflow-y-auto shadow-2xl"><h2 class="font-black text-2xl mb-2 text-gray-900">Location</h2><p class="text-gray-400 text-sm mb-6">Frequencies vary by region.</p><div class="space-y-1">${state.regions.map(r => `<button onclick="state.tempScrapedData ? executeScoring(state.tempScrapedData, '${r}') : processCSV('${r}')" class="w-full text-left p-4 border-b hover:bg-blue-50 font-bold text-gray-800 transition-colors flex justify-between"><span>${r}</span><span class="text-blue-500">→</span></button>`).join('')}</div><button onclick="state.showRegionPrompt=false; state.tempScrapedData=null; render();" class="w-full mt-6 text-gray-400 font-black uppercase text-xs tracking-widest">Back</button></div></div>`;
        }

        function renderHowItWorks() {
            return `<div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 z-50"><div class="bg-white rounded-[40px] p-8 max-w-md shadow-2xl relative"><h2 class="font-black text-2xl mb-4 text-gray-900">How Scoring Works</h2><div class="space-y-6">
                <div class="flex gap-4"><div class="text-3xl bg-blue-50 w-14 h-14 rounded-2xl flex items-center justify-center">📉</div><div><h4 class="font-black text-gray-900">Rarity Score</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">MEGA RARE < 2%, RARE < 10%, SCARCE < 20%, UNCOMMON < 30%.</p></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-yellow-50 w-14 h-14 rounded-2xl flex items-center justify-center">🟡</div><div><h4 class="font-black text-gray-900">Birdseed</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">Earn 1 seed for every 10,000 cumulative points (from all checklists!). Use seed to buy eggs in the Nest.</p></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-purple-50 w-14 h-14 rounded-2xl flex items-center justify-center">✨</div><div><h4 class="font-black text-gray-900">Novelty Bonuses</h4><ul class="text-[11px] text-gray-500 space-y-1 mt-1 font-bold"><li>✨ <span class="text-green-600 uppercase tracking-tighter">Life Bird:</span> 4x bonus</li><li>🐦 <span class="text-blue-500 uppercase tracking-tighter">2nd Sighting:</span> 2x bonus</li></ul></div></div>
                <div class="flex gap-4"><div class="text-3xl bg-green-50 w-14 h-14 rounded-2xl flex items-center justify-center">🔢</div><div><h4 class="font-black text-gray-900">Observation Multiplier</h4><p class="text-[11px] text-gray-500 font-bold leading-relaxed">Every bird counts! Independent sightings of a species count towards your score.</p></div></div>
            </div><button onclick="state.showHowItWorks=false;render()" class="w-full bg-gray-900 text-white mt-10 py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-blue-600 transition-all">Got it</button></div></div>`;
        }

        loadData();
    </script>
</body>
</html>
